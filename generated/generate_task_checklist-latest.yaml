    - n: 55
      text: Verify all required context is loaded.
      status: REAL
      evidence: completion of ai-os/scripts/session_bootstrap.py (sections A+B above)
    - n: 56
      text: Verify execution is safe.
      status: REAL
      evidence: scripts/preflight-guard.py hard gate (disk/mem/circuit-breaker) before model invocation
    - n: 57
      text: Verify approval is available if required.
      status: NOT_YET_AVAILABLE
      evidence: same gap as item 6 -- no approval-queue mechanism
  - letter: I
    title: Execute
    items:
    - n: 58
      text: Execute through Software.
      status: REAL
      evidence: registries.credit_spend_governance + this session's own scripts
    - n: 59
      text: Execute AI only where required.
      status: REAL
