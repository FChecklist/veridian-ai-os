decision_1_model_routing:
  scope: all_server_ai_sessions (interactive_tmux_session AND headless_workers AND supervisor)
  change: replace GLM/OpenRouter proxy routing with real Anthropic auth via Claude Max subscription
  current_mechanism_to_change: scripts/worker-entrypoint.sh lines ~32-35 (unset CLAUDE_CODE_OAUTH_TOKEN; export ANTHROPIC_BASE_URL=http://127.0.0.1:8787; export ANTHROPIC_API_KEY=proxy-routed-not-a-real-anthropic-key)
  target_state: export real CLAUDE_CODE_OAUTH_TOKEN (the token currently in ~/.claude/.credentials.json, NOT the stale one in shared/.env - verify which is current before use), do not set ANTHROPIC_API_KEY or ANTHROPIC_BASE_URL, default model = sonnet, effort = high
  constraint_do_not_break: preflight/circuit-breaker/budget-cap machinery in worker-entrypoint.sh exists because of a real prior incident (2026-07-20 RCA: 47 failed units, 71.9% task failure rate, documented in repos/compliance-tracker/ai-os/COST-CONTROL.md). Do not delete this machinery.
  known_incompatibility: preflight currently checks live OpenRouter balance as a hard-stop condition. This check is meaningless once OpenRouter routing is removed. Replace with an equivalent guard against Claude Max subscription usage/rate-limit exhaustion if the CLI or account API exposes that signal; if no such signal exists, say so explicitly in the report rather than silently dropping the safety check.
  side_effect_to_flag_in_report: interactive session and all workers will now share ONE Claude Max subscription's usage limits. Multiple concurrent autonomous workers could exhaust the Owner's own interactive weekly quota. Report this risk explicitly, do not just note it in passing.
  glm_proxy_service_veridian-glm-proxy.service: after the switch, determine whether this service has any remaining legitimate use; if none, report that finding rather than deciding unilaterally to remove it.

