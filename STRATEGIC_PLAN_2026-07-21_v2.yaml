meta:
  id: VERIDIAN-STRATEGIC-PLAN-2026-07-21
  version: '2.0'
  source: Owner directive 2026-07-21 (chat, '14 Files.txt' attachment)
  status: DEEP_EVALUATION_COMPLETE_PLANNING_ONLY_NOT_EXECUTED
  reason: 'Owner flagged ~96% of weekly Claude Code token budget consumed at time of receipt (weekly reset
    Thu 2026-07-22 07:30 IST). Given the raw task list, taken literally, is many weeks of net-new engineering
    (a full visualization engine, a presentation engine, a full browser SDK, a full AI-context-optimizer
    architecture, a new pricing/token-ledger engine, Odoo/Zoho-grade completeness across every module/brand,
    plus 3 full audit-and-fix cycles), attempting real implementation against ~4% remaining budget risked
    a rushed, unverifiable, possibly-broken result -- directly against the Owner''s own "zero failure
    / extremely high standard" requirement. Owner was asked and chose: plan only now, execute after reset.'
  numbering_note: Owner's own numbering skips "Task 9" (jumps 8 to 10) and has two items each labeled
    "Task 12" and "Task 14". Renumbered below as PLAN-01.. PLAN-16 in literal document order, each cross-referenced
    to the Owner's original label so nothing is silently dropped or merged without saying so.
  guardrails_applied:
  - ai-os/STANDING_DIRECTIVE.yaml (precheck/logging/verification)
  - ai-os/AI_ENGINEERING_POLICY.yaml#automation_scope_boundary
  - ai-os/RULES_ARTICLES_198.json (mandatory guardrail, not yet re-run against this plan's future output
    -- verification.self_certification is forbidden per STANDING_DIRECTIVE.yaml, so PLAN-07's own 198-audit
    run is the actual verification step, not a claim made here)
  next_step: 'After 2026-07-22 07:30 IST reset: register one ai-os/boss/ ACTIVE-CLAIMS.yaml claim per
    task (not one giant claim), execute in sequence order below, verify each before moving to the next,
    log each in ai-os/boss/COMPLETED.yaml with a fresh WAVE-N number checked at commit time (many concurrent
    waves landed 2026-07-21, don''t assume a stale highest-N).'
  v2_note: This supersedes v1 (2026-07-21 initial pass, written under severe token-budget pressure with
    many UNKNOWN/not-yet-checked placeholders). v2 reflects real, evidence-based investigation by 3 parallel
    deep-evaluation agents against the live codebase, live Supabase data, and a real 198-audit re-run.
    Still zero implementation -- Owner has not yet authorized execution.
  headline_corrections:
  - 'VERIFIED FALSE: the 2026-07-21 session''s own claim that Wave 4 proved end-to-end CRM chat-to-DB
    wiring (create_lead/create_opportunity via dispatchTool()) does not hold on live re-verification --
    zero real hits found. Only Compliance and GST reconciliation have genuinely proven mode-pill -> chain
    -> dispatchTool() -> DB-write wiring today. This is the single most important correction in this whole
    plan and should be corrected in project memory, not just this file.'
  - 'PLAN-07 re-run: real current 198-rule state is 22 ENFORCED / 153 PARTIALLY_ENFORCED / 14 NOT_YET_BUILT
    / 9 NEEDS_HUMAN_JUDGMENT (vs stale 22/152/15/9). ARTICLE-094 regressed to NEEDS_HUMAN_JUDGMENT --
    root-cause this before proceeding.'
dependency_table:
- edge: PLAN-01 -> PLAN-02
  original_plan_claim: PLAN-02 depends_on [PLAN-01]
  verified_mechanism: 'WEAK/SOFT, not a hard blocker. PLAN-02''s new dispatch branches render inside whichever
    VeriComposer instance is currently mounted in AppShell.tsx:162, imported today as `import { PanelShell
    } from "@fchecklist/veridian-ui-kit/panel"` (and similar shell/composer imports) at the CURRENT pinned
    version (github:FChecklist/veridian-ui-kit#v0.2.2). That composer already renders capability-tree
    leaves correctly today (proven by the Compliance/GST reference case) -- PLAN-02 does not need PLAN-01''s
    kit-version bump to land first. Sequencing PLAN-01 first is a convenience (new capability-tree leaves
    get the newest chain-selector UX immediately) not a technical dependency. Corrected status: PARALLEL-SAFE.'
- edge: PLAN-01 -> PLAN-03
  original_plan_claim: PLAN-03 depends_on [PLAN-01, PLAN-02]
  verified_mechanism: 'REAL but narrow: PLAN-03''s new generic report-renderer page (src/app/(app)/reports/catalog/[reportId]/page.tsx,
    see PLAN-03 plan below) should be built as a child route under the same (app) layout that AppShellFrame/AppHeader/AppSidebar
    (from @fchecklist/veridian-ui-kit/shell) already provide, so it inherits chrome/tokens automatically
    via existing src/app/(app)/layout.tsx -- it needs zero NEW work from PLAN-01, just needs to not be
    built outside that layout tree. The claimed dependency on PLAN-02 does NOT hold: report_definitions
    rows are rendered from report_definitions + existing *-service.ts data queries directly, never through
    dispatchTool(). Corrected: depends only on (app) layout already existing today (it does) -- not blocked
    on either PLAN-01 or PLAN-02 completing.'
- edge: PLAN-02 -> PLAN-04
  original_plan_claim: PLAN-04 depends_on [PLAN-02]
  verified_mechanism: 'REAL and specific. PLAN-04''s extended 2-axis classifier (routing-determinism +
    token-cost, see PLAN-04 plan below) must classify EVERY codeReference/engineKey leaf that exists in
    capability-tree-service.ts at the time it runs. Every new leaf PLAN-02 adds (one per wired module
    action) needs the same classification. THE MECHANISM: PLAN-04''s audit script (ai-os/scripts/veri-escalation/audit-ai-backed-leaves.mjs)
    must be RE-RUN once after PLAN-02''s codegen lands (not before), specifically against the new codeReference
    branches PLAN-02 injects into task-execution-engine.ts, so the taxonomy stays accurate. Confirmed
    hard sequencing: PLAN-04''s classifier run happens AFTER PLAN-02''s generator run, same session, not
    a separate wave.'
- edge: PLAN-02 -> PLAN-05
  original_plan_claim: PLAN-05 depends_on [PLAN-02] (cannot E2E-test incomplete modules)
  verified_mechanism: 'SPLIT FINDING -- the original claim conflates two different sub-activities that
    have different dependency profiles. (a) Demo-DATA SEEDING (the scripts/seed-demo-org-full-coverage.mjs
    work, see PLAN-05 plan below) has ZERO dependency on PLAN-02 -- it is pure DB row insertion into tables
    that already exist in the schema today, independent of whether dispatchTool() wiring exists for them.
    Can run immediately, in parallel with PLAN-01..04. (b) The "3x end-to-end RUN" requirement (click
    through the UI/chat flow 3 times, fix breakage) genuinely needs PLAN-02''s dispatch wiring to exist
    for any module being tested via the chat/pill/chain path specifically -- CRUD-only modules can still
    be E2E-tested via their existing REST-backed pages regardless of PLAN-02. Corrected: seeding is PARALLEL-SAFE;
    only the chat-path E2E coverage of PLAN-02''s newly-wired actions has a real sequential dependency.'
- edge: PLAN-01..05 -> PLAN-06
  original_plan_claim: PLAN-06 depends_on [PLAN-01, PLAN-02, PLAN-03, PLAN-04, PLAN-05]
  verified_mechanism: 'CONFIRMED REAL, hard sequential dependency -- this is a genuine constraint, not
    a guess. PLAN-06''s 3-round-audit process needs actual PRs/diffs/script-run-logs from PLAN-01..05
    to exist as artifacts before round 1 can start (you cannot audit work that hasn''t landed). MECHANISM:
    each of PLAN-01..05 must produce a dated entry in ai-os/boss/COMPLETED.yaml (per this repo''s existing
    convention) before PLAN-06 round 1 begins; PLAN-06''s checklist template (see below) explicitly requires
    linking each finding to a COMPLETED.yaml wave number, so the mechanism of "done" is machine-checkable,
    not a verbal claim.'
- edge: PLAN-08 depends_on PLAN-07
  concrete_mechanism: 'PLAN-08''s feature-completion script (feature-completion-audit.mjs) reuses the
    SAME evidence philosophy as PLAN-07''s audit198 evidence-engine.mjs (keyword/identifier grep against
    live repo state -> deterministic verdict, no free-text judgment). PLAN-07 had to run first only to
