- id: PLAN-01
  title: UI/UX unification across brands -- DEEP-DIVE REPLACEMENT
  verified_current_state: "@fchecklist/veridian-ui-kit (github.com/FChecklist/veridian-ui-kit) is real,\
    \ at 6 commits, tagged v0.1.0 through v0.3.0 plus 1 unreleased commit (81671c0, adds ai-os/FUNCTION_CATALOG.json).\
    \ Exports (per its package.json \"exports\" map): ./tokens/tailwind-preset, ./tokens/fonts, ./tokens/globals.css,\
    \ ./shell, ./composer, ./panel, ./context, ./prompt-patterns. Both compliance-tracker AND projexa\
    \ repos depend on it, both pinned to `github:FChecklist/veridian-ui-kit#v0.2.2` in their package.json\
    \ (line 25 in compliance-tracker's, line 15 in projexa's) -- one version behind v0.3.0 (which added\
    \ src/prompt-patterns/) and two behind unreleased HEAD. compliance-tracker's REAL current consumption\
    \ (grep-verified, file:line):\n  - src/app/globals.css:14 `@import \"@fchecklist/veridian-ui-kit/tokens/globals.css\"\
    `\n  - src/app/layout.tsx:9 imports veridianHeadingFont/veridianSansFont from ./tokens/fonts\n  -\
    \ src/components/AppShell.tsx:3 imports AppShellFrame from ./shell\n  - src/components/AppSidebar.tsx:6\
    \ imports SharedAppSidebar from ./shell\n  - src/components/AppTopbar.tsx:15 imports AppHeader from\
    \ ./shell\n  - src/components/veri-chat/VeriChatPanel.tsx:23 imports PanelShell from ./panel\n  -\
    \ src/components/veri-chat/HomeThreadSlot.tsx:14 imports ThreadView from ./panel\n  - src/components/veri-chat/veri-chat-context.tsx:19-20\
    \ imports createVeriChatContext, FIXED_MODES from ./context\ncompliance-tracker's REMAINING LOCAL\
    \ (not-yet-kit) files, confirmed real and product-specific (NOT dead duplication -- verified by reading\
    \ src/components/veri-chat/ChainSelector.tsx header comment, which explicitly imports FIXED_MODES/CapabilityNode\
    \ from its own veri-chat-context.tsx, ties into task-service.ts's resolveDynamicChainId() and dispatchInstruction(),\
    \ i.e. business-logic wiring the kit's README explicitly and deliberately excludes from its own scope):\n\
    \  - src/components/veri-chat/ChainSelector.tsx (product-specific chain logic)\n  - src/components/veri-chat/VeriComposer.tsx\
    \ (product-specific composer wrapper)\n  - src/components/ForgeIntakeComposer.tsx (unrelated intake\
    \ feature, not a UI-kit duplicate)\nPROJEXA repo mirrors this exact same split (its own local src/components/veri-chat/VeriComposer.tsx/ChainSelector.tsx/\
    \ VeriChatPanel.tsx alongside the same kit imports) -- confirming the kit-vs-product-layer boundary\
    \ is a real, intentional, working architecture already, not an unreconciled mess. The kit's own README\
    \ states this boundary explicitly: \"owns the shell... deliberately does NOT own... the real task-dispatch\
    \ backend.\" CORRECTED VERDICT: PLAN-01 is not \"build veridian-ui-kit from scratch, then merge.\"\
    \ It is: (1) close a 2-tag version-drift gap (v0.2.2 -> v0.3.0+), (2) verify no regressions from the\
    \ newly-added prompt-patterns export, (3) resolve the still-open \"Wave 8\" item (PROJEXA's duplicate\
    \ composer -- confirmed still present, not verified live/dead), (4) run a drift-detection script (not\
    \ manual eyeballing) comparing local product-layer files against the kit's shell/composer contracts."
  automation_mechanism:
    script_1:
      path: ai-os/scripts/ui-kit-sync/detect-kit-drift.mjs
      purpose: Reads @fchecklist/veridian-ui-kit's actual exported TypeScript interfaces (via the `typescript`
        package's Compiler API, already a devDependency in both consuming repos -- no new dependency needed)
        from the version currently on disk in node_modules, diffs them against the interfaces consumed
        by compliance-tracker's and projexa's local product-layer files (AppShell.tsx, AppSidebar.tsx,
        AppTopbar.tsx, VeriChatPanel.tsx, HomeThreadSlot.tsx, veri-chat-context.tsx). Emits a machine-readable
        JSON report of any prop/type mismatch BEFORE a version bump, so nothing is manually eyeballed
        screen-by-screen.
      exact_command: node ai-os/scripts/ui-kit-sync/detect-kit-drift.mjs --repo compliance-tracker --against-version
        v0.3.0
      run_again_for: node ai-os/scripts/ui-kit-sync/detect-kit-drift.mjs --repo projexa --against-version
        v0.3.0
    script_2:
      path: ai-os/scripts/ui-kit-sync/bump-and-verify.sh
      purpose: 'One script, run once per consuming repo, that (a) edits package.json''s veridian-ui-kit
        dependency line from #v0.2.2 to #v0.3.0 (sed/jq, not manual edit), (b) reinstalls (bun install
        / npm install depending on repo''s lockfile), (c) runs `tsc --noEmit`, (d) runs the repo''s existing
        test suite filtered to veri-chat/composer-related test files (ChainSelector.test.ts confirmed
        to exist in compliance-tracker), (e) exits non-zero on any failure so it cannot be silently treated
        as done.'
      exact_command: bash ai-os/scripts/ui-kit-sync/bump-and-verify.sh compliance-tracker v0.3.0
    script_3:
      path: ai-os/scripts/ui-kit-sync/find-duplicate-composer-usage.mjs
      purpose: 'Answers the still-open "Wave 8: is PROJEXA''s local VeriComposer live or dead code" question
        mechanically instead of manual code reading: greps every .tsx file in /opt/veridian/repos/projexa/src
        for actual JSX usage (`<VeriComposer`, `<ChainSelector`, `<VeriChatPanel`) of the LOCAL import
        path vs the kit''s, cross- references against the Next.js route manifest (.next/server/app-paths-manifest.json
        after a build) to confirm which routes actually render it in production, not just import it.'
      exact_command: node ai-os/scripts/ui-kit-sync/find-duplicate-composer-usage.mjs --repo projexa
  step_by_step_plan:
  - 1. Run script_1 (detect-kit-drift.mjs) against both repos at v0.3.0. If it exits non-zero (breaking
    interface changes found), STOP and read the JSON diff report before proceeding -- do not bump blind.
  - 2. If script_1 is clean, run script_2 (bump-and-verify.sh) for compliance-tracker, then for projexa.
    Each run is a single self-contained pass; do not hand-edit package.json.
  - '3. Run script_3 (find-duplicate-composer-usage.mjs) against projexa to get a definitive live/dead
    verdict on its local composer. If LIVE: file this as its own small follow-up wave (retire it, re-point
    to the kit''s composer + projexa''s own veri-chat-context, same pattern compliance-tracker already
    completed 2026-07-19 per its own code comments) -- do not fold that retirement into this same pass,
    since it touches a live user-facing surface (per this session''s own risk-sequencing convention: UX-surface
    changes get their own scoped wave, not a bundled one). If DEAD: delete the dead files in the same
    PR as the version bump, no separate wave needed.'
  - 4. Tag a new veridian-ui-kit release only if step 1-3 required any fix commits to the kit itself;
    otherwise v0.3.0 is already the target, no new tag needed.
  - '5. Verification: `bunx tsc --noEmit` clean in both consuming repos AND the kit repo itself; existing
    ChainSelector.test.ts passes; script_3''s live/dead verdict is recorded in ai-os/boss/COMPLETED.yaml,
    not left as an open question.'
  effort_reestimate: small-to-medium (version bump + one drift script + one live/dead determination),
    not large -- the large 'build the kit from scratch' framing in the original plan is superseded by
    verified reality.
- id: PLAN-02
  title: Full module completion (Odoo/Zoho-grade) + universal dynamic-pill/chain pattern -- DEEP-DIVE
    REPLACEMENT (still the single largest item, but now with a real per-module map instead of a guess)
  verified_module_completeness_table:
  - module: Compliance (core compliance_items register)
    classification: FULL
    evidence: create_compliance_item (real db.insert, task-execution-engine.ts line ~199) and update_compliance_status
      (real db.update, line ~169) both dispatchTool()-reachable via codeReference, both registered as
      workerAgents rows resolved in capability-tree-service.ts:1328-1362, scoped into the composer via
      MODULE_SCOPE_TOP_LEVEL_KEYS.compliance (line 928).
    scaffolding_reuse: N/A -- this IS the reference template every other module's generator entry copies.
  - module: GST reconciliation / GST returns
    classification: FULL
    evidence: confirm_gst_batch, generate_gst_return, run_gst_reconciliation all real codeReference branches
      with dynamically-generated capability-tree leaves (one per return period), capability-tree-service.ts
      lines ~1395-1456.
    scaffolding_reuse: N/A -- second proven reference pattern.
  - module: CRM (Leads/Opportunities/Kanban)
    classification: NONE for CRUD actions (5 read-only analytics calculators are FULL but irrelevant to
      task completion)
    evidence: Zero hits for create_lead/create_opportunity anywhere in task-execution-engine.ts or capability-tree-service.ts
      (exhaustive grep). Real writes exist only via createLead()/createOpportunity() in src/lib/services/crm-service.ts
      (lines 66, 168 -- confirmed real Drizzle inserts) called from plain REST routes (src/app/api/crm/leads/route.ts:27,
      src/app/api/crm/opportunities/route.ts:27) and directly from src/app/(app)/crm/page.tsx:103 via
      fetch() -- ordinary form CRUD, entirely outside the composer/capability-tree/dispatchTool pipeline.
      CRM_WIRED_ENGINE_INPUT_FIELDS (capability-tree-service.ts:732-754) + dispatchTool cases (task-execution-engine.ts:1386-1414)
      exist but only cover customer_lifetime_value_calculator, churn_probability_calculator, rfm_scoring_engine,
      opportunity_score_calculator, customer_health_score -- all imported from src/lib/engines/ crm-engine.ts
      (47 lines, zero DB references, confirmed read-only).
    scaffolding_reuse: 'HIGH -- createLead()/createOpportunity() already exist, real, DB-backed, validated.
      This is the cheapest module to wire: purely a codeReference-branch + capability-tree-category addition,
      zero new business logic needed.'
  - module: Finance/Accounting (invoicing, journal-entries)
    classification: NONE
    evidence: 'Explicit code comment, task-execution-engine.ts lines ~702-708: 9 core accounting engines
      (journal_posting_engine, ledger_posting_engine, trial_balance_engine, balance_sheet_engine, etc.)
      are "deliberately NOT re-dispatched here." Real function createJournalEntry() exists in src/lib/services/
      erp-accounting-service.ts:229 (confirmed real db.insert(erpJournalEntries) at line 257). Zero capability-tree
      entries exist for any of these engine names (grep returns 0 hits). create_invoice/generate_invoice:
      0 hits anywhere. erp/invoicing/page.tsx and erp/journal-entries/page.tsx have no composer/dispatchTool
      references.'
    scaffolding_reuse: VERY HIGH -- full DB-backed service layer already exists (erp-accounting-service.ts,
      erp-invoicing-service.ts, erp-financial-report-service.ts confirmed present). Second-cheapest module
      to wire.
  - module: HR/Payroll
    classification: NONE for CRUD; calculators only
    evidence: No create_employee/process_payroll/run_payroll codeReference or capability-tree entry found
      anywhere. HR_WIRED_ENGINE_INPUT_FIELDS/ PAYROLL_WIRED_ENGINE_INPUT_FIELDS (task-execution-engine.ts
      lines 792-997) cover only formula calculators (gratuity, bonus, overtime, attrition, payroll-math).
      Pages checked (hr/page.tsx, erp/payroll/page.tsx, recruitment/page.tsx, performance-reviews/page.tsx)
      have zero composer references.
    scaffolding_reuse: INFERRED, NOT CONFIRMED -- whether an hr-service.ts/ payroll-service.ts with real
      DB writes exists in the same shape as crm-service.ts/erp-accounting-service.ts was not read in the
      time available. Treat as "likely high reuse, verify before estimating effort" rather than assumed.
  - module: Sales (Sales-HQ)
    classification: NONE for CRUD; calculators only
    evidence: 'SALES_WIRED_ENGINE_INPUT_FIELDS (capability-tree-service.ts: 762-783) covers pricing_engine,
      quote_optimizer, sales_forecast_engine, pipeline_probability_engine, margin_calculator, markup_calculator
      -- all calculators. sales-hq/page.tsx has zero composer references. No sales CRUD codeReference
      found.'
    scaffolding_reuse: INFERRED, NOT CONFIRMED -- same caveat as HR/Payroll.
  - module: PROJEXA construction -- labour, materials, permits (3 of 11 checked directly)
    classification: NONE
    evidence: 'LabourClient.tsx and equivalent page shells in /opt/veridian/repos/projexa are pure fetch("/api/labour-roster"),
      fetch("/api/materials"), fetch("/api/permits") REST CRUD (own Next.js API routes, Supabase-backed).
      Zero Composer/ChainSelector/ dispatchTool references in any of the 3 client components checked.
      PROJEXA''s own src/app/api/capability-tree/route.ts and src/app/api/assistant/route.ts are confirmed
      THIN PROXIES to compliance-tracker''s /api/v1/projexa/* endpoints (explicit in-code comment: keeps
      the VERIDIAN bearer key server-side) -- PROJEXA has no capability-tree-service.ts or task-execution-engine.ts
      of its own.'
    scaffolding_reuse: MEDIUM -- REST CRUD routes already exist and presumably work; the remaining 8 construction
      modules (site-diary, floor-plans, ffe, mood-boards, procurement, purchase-orders, change-orders,
      quotations) were NOT individually checked but the 3-of-3 pattern found (pure REST CRUD, zero composer
      wiring) is a strong, consistent signal -- treat as INFERRED-to-generalize, not separately verified
      per module.
  - module: PROJEXA construction dashboards (read-only, IN compliance-tracker)
    classification: PARTIAL
    evidence: get_construction_project_dashboard, list_delayed_activities, get_construction_budget_status,
      list_over_budget_projects, get_construction_kpi_status, generate_construction_progress_summary,
      detect_construction_budget_schedule_risk are ALL real dispatchTool codeReference branches (task-execution-engine.ts
      lines ~299-345+) -- but every one is read-only (dashboard/summary queries), zero create/update actions
      for labour, materials, permits, POs, change-orders exist in the dispatch pipeline.
    scaffolding_reuse: Dashboard-read layer exists; CRUD-write layer entirely absent from dispatch.
  strategic_priority_ranking_cheapest_to_most_expensive:
  - 1. Compliance + GST -- already done, use as literal template.
  - 2. CRM (createLead/createOpportunity already real, DB-backed) -- cheapest net-new wire.
  - 3. Finance/Accounting (createJournalEntry + full erp-accounting-service.ts already real) -- second
    cheapest.
  - 4. PROJEXA construction CRUD (8-11 modules, REST layer already exists, needs new proxy-aware wiring
    since PROJEXA has no local capability-tree-service.ts) -- medium cost, but same shape repeated many
    times, hence the codegen approach below matters most here.
  - 5. HR/Payroll and Sales-HQ -- unverified whether service layer exists; must be confirmed BEFORE estimating,
    could be cheap (if service layer exists) or expensive (if it needs net-new writes).
  automation_mechanism:
    design_rationale: 'Owner directive: no table-by-table manual wiring. The Compliance reference case
      shows every module''s wiring needs the exact same 3-part shape: (a) a CapabilityInputField[] const
      array (validated form fields), (b) a workerAgents DB row with a codeReference, feeding a buildXNodes()
      function registered in MODULE_SCOPE_TOP_LEVEL_KEYS, (c) a codeReference branch in dispatchTool()''s
      if-chain that validates context.inputs and performs the real write (in Compliance''s case, inlined
      rather than calling the service function directly, because dispatch context''s shape differs from
      service-layer ServiceContext -- the generator below produces an adapter shim automatically rather
      than assuming direct passthrough). This 3-part shape is mechanical enough to generate from a manifest.
      No new dependency is needed for the codegen itself -- the `typescript` package (already a devDependency,
      ^6.0.3, confirmed via package.json) provides the Compiler API used for safe AST-based insertion
      instead of fragile string templating.'
    pipeline:
      step_A_scaffold_manifest:
        script: ai-os/scripts/wire-module-dispatch/scaffold-manifest.mjs
        purpose: Introspects a given *-service.ts file's exported functions (via ts.createSourceFile +
          ts.forEachChild, reading function name, parameter names, and parameter types) and auto-proposes
          manifest entries (action_id, required_fields with best-guess type/label, target db table inferred
          from the function body's db.insert(<table>) call). This is NOT the human writing the manifest
          from scratch -- it's the human reviewing/approving a machine-generated first draft, roughly
          5 minutes per module, not hours of manual design.
        exact_commands:
        - node ai-os/scripts/wire-module-dispatch/scaffold-manifest.mjs --service src/lib/services/crm-service.ts
          --module crm --scope-key crm >> ai-os/scripts/wire-module-dispatch/module-actions-manifest.yaml
        - node ai-os/scripts/wire-module-dispatch/scaffold-manifest.mjs --service src/lib/services/erp-accounting-service.ts
          --module finance --scope-key erp >> ai-os/scripts/wire-module-dispatch/module-actions-manifest.yaml
        - node ai-os/scripts/wire-module-dispatch/scaffold-manifest.mjs --service <hr-service-file, CONFIRM
          PATH FIRST -- see verification note below> --module hr --scope-key hr >> ai-os/scripts/wire-module-dispatch/module-actions-manifest.yaml
        - node ai-os/scripts/wire-module-dispatch/scaffold-manifest.mjs --service <sales-service-file,
          CONFIRM PATH FIRST> --module sales --scope-key sales >> ai-os/scripts/wire-module-dispatch/module-actions-manifest.yaml
        precondition_verification_step: 'Before running the HR/sales lines, run: `find src/lib/services
          -iname ''*hr*service*'' -o -iname ''*payroll*service*'' -o -iname ''*sales*service*''` to confirm
          the actual file path/existence first (this was explicitly NOT verified in this deep-dive --
          do not assume the path, discover it mechanically).'
        for_projexa_construction_modules: 'Since PROJEXA has no local service-layer file in the same shape
          (its writes go through its own Next.js API routes directly to Supabase, not through a compliance-tracker-style
          *-service.ts), run scaffold-manifest.mjs in a second mode against PROJEXA''s API route handlers
          instead: `node ai-os/scripts/wire-module-dispatch/scaffold-manifest.mjs --api-routes /opt/veridian/repos/projexa/src/app/api/{labour-roster,materials,permits,punch-list,floor-plans,ffe,procurement,purchase-orders,change-orders,quotations,mood-boards}
          --module construction --scope-key construction --target-repo compliance-tracker` (the manifest
          entries land in compliance-tracker''s task-execution-engine.ts, since that''s where codeReference
          dispatch lives; PROJEXA''s existing thin-proxy pattern (src/app/api/assistant/route.ts) then
          reaches them automatically once registered, requiring zero new PROJEXA-side code).'
      step_B_generate_bindings:
        script: ai-os/scripts/wire-module-dispatch/generate-dispatch-bindings.mjs
        purpose: 'Reads the FULL manifest (all modules, one pass) and mechanically injects, via the TypeScript
          Compiler API (not string concatenation): (1) one CapabilityInputField[] const + one buildXNodes()
          function + one MODULE_SCOPE_TOP_LEVEL_KEYS entry per module into capability-tree-service.ts,
          anchored immediately after the existing buildComplianceItemNodes() function (capability-tree-service.ts
          line ~1323) using it as the literal structural template; (2) one codeReference if-branch per
          manifest action into task-execution-engine.ts, anchored immediately after the existing create_compliance_item
          branch (line ~185), following its exact validate-then-insert shape. Every module in the manifest
          is done in ONE script execution, not module-by-module by hand.'
        exact_command: node ai-os/scripts/wire-module-dispatch/generate-dispatch-bindings.mjs --manifest
          ai-os/scripts/wire-module-dispatch/module-actions-manifest.yaml --dry-run
        then: node ai-os/scripts/wire-module-dispatch/generate-dispatch-bindings.mjs --manifest ai-os/scripts/wire-module-dispatch/module-actions-manifest.yaml
          --apply
      step_C_seed_worker_agents:
        script: ai-os/scripts/wire-module-dispatch/seed-worker-agents.mjs
        purpose: 'buildXNodes() (per the Compliance template) queries db.query.workerAgents.findFirst({
          where: eq(codeReference, ...) }) -- the row must exist or the leaf silently never appears. This
          script reads the same manifest and emits+applies one INSERT INTO worker_agents per action, in
          one batch, instead of manual SQL per module.'
        exact_command: node ai-os/scripts/wire-module-dispatch/seed-worker-agents.mjs --manifest ai-os/scripts/wire-module-dispatch/module-actions-manifest.yaml
          --apply
      step_D_verify:
        exact_commands:
        - bunx tsc --noEmit
        - bun test src/lib/task-execution-engine.test.ts src/lib/services/capability-tree-service.test.ts
        - node ai-os/scripts/wire-module-dispatch/smoke-test-new-actions.mjs --manifest ai-os/scripts/wire-module-dispatch/module-actions-manifest.yaml
          --target-org <disposable-test-org-id>
        smoke_test_script_purpose: Automatically POSTs to /api/tasks with a synthetic codeReference dispatch
          for EVERY new manifest action against one disposable test org (not demo_org, not production),
          asserts a real DB row landed in the target table, then deletes it -- this replaces "manually
          click every module in the browser 20 times" with one script run covering all of them.
  step_by_step_plan:
  - 1. Confirm HR/Payroll and Sales-HQ service-layer file paths (precondition_verification_step above)
    -- do not skip, this was the one gap left open in this audit.
  - 2. Run scaffold-manifest.mjs once per module (CRM, Finance, HR, Sales, then the PROJEXA API-routes
    mode for construction) -- produces one combined manifest file.
  - 3. Human review pass on the generated manifest (~5 min/module, approve/edit field labels and types)
    -- this is the ONE deliberately-manual step, and it is reviewing machine output, not authoring from
    scratch.
  - 4. Run generate-dispatch-bindings.mjs --dry-run, inspect the diff, then --apply.
  - 5. Run seed-worker-agents.mjs --apply.
  - 6. Run all of step_D_verify's three commands. Do not consider PLAN-02 done until the smoke-test script
    shows 100% pass across every manifest action.
  - 7. Log each module's completion as its own ai-os/boss/COMPLETED.yaml wave entry (per this repo's convention),
    not one giant entry -- PLAN-06's audit needs per-module granularity.
  effort_reestimate: Still large in absolute engineering surface (CRM + Finance + HR + Sales + 8-11 PROJEXA
    modules), but the manifest+codegen approach converts what would have been ~15-20 separate hand-written
    PRs into 1-2 codegen-script runs + 1 human review pass + 1 automated smoke test. Recommend still tracking
    as its own dedicated execution track (the 2026-07-21 plan's instinct on this was correct) but the
    actual execution mechanism is now concrete rather than open-ended.
- id: PLAN-03
  title: OSS + custom professional templates (reports/HTML/dashboards) -- DEEP-DIVE REPLACEMENT
  verified_current_state: "compliance.report_definitions: real table, 18 columns, 200 live rows (VERIFIED\
    \ via live psql/Supabase MCP query: 109 status=built, 85 status=data_gap, 6 status=planned). output_formats\
    \ breakdown (also live-queried): 171 rows = [\"table\"] only, 29 rows = [\"table\",\"chart\"], ZERO\
    \ rows specify pdf/html/dashboard as an output format -- the entire live catalog's format vocabulary\
    \ is closed to table/chart. Consumed ONLY by capability-tree-service.ts (confirmed by repo-wide grep\
    \ + an explicit in-code admission comment in src/app/api/reports/catalog/route.ts) -- zero .tsx pages\
    \ render it. 4 genuinely real, separately-built pieces of report/dashboard UI already exist, unconnected\
    \ to this catalog:\n  - src/app/(app)/reports/page.tsx (638 lines) -- Compliance Reports\n    export\
    \ page, real, exports via jsPDF/XLSX/PPTX/docx/HTML from\n    /api/compliance/stats + /api/compliance\
    \ data.\n  - src/app/(app)/reports/create/page.tsx (230 lines) +\n    src/components/CustomReportsSection.tsx\
    \ (507 lines) -- real AI\n    ad-hoc report-builder (upload image/Excel/Word ->\n    /api/reports/ai-builder/analyze\
    \ -> save -> render).\n  - src/app/(app)/kpi-hub/page.tsx (104 lines) -- real, live-data KPI\n   \
    \ dashboard.\n  - src/app/(app)/orchestra/analytics/page.tsx (121 lines) -- real,\n    live-data dashboard\
    \ with a genuine recharts BarChart.\nreact-pdf: confirmed completely absent (0 hits in package.json\
    \ and src/). Actual PDF infra in use: jspdf + jspdf-autotable (both real deps, used in 5 files). Chart\
    \ infra in use: recharts (^3.9.2) only -- no chart.js/echarts/d3/visx/nivo. None of PLAN-10's 11 candidate\
    \ visualization libraries (Superset, Evidence, ECharts, Perspective, React Flow, Mermaid, Frappe Gantt,\
    \ @hello-pangea/dnd, AG Grid, MapLibre, React PDF Viewer) are present. CRITICAL FINDING FOR SCOPE:\
    \ since 100% of the live report_definitions catalog's output_formats vocabulary is table/chart, and\
    \ recharts + jspdf/jspdf-autotable ALREADY cover both of those formats today, **zero new library dependencies\
    \ are required to close this specific gap** -- PLAN-03 does not need to wait on or overlap with PLAN-10's\
    \ 11-library visualization engine at all. This corrects the original plan's implicit assumption that\
    \ PLAN-03 needs new OSS sourcing."
  automation_mechanism:
    design_rationale: 'Owner directive: no per-report manual page-building for 200 rows. One generic,
      metadata-driven renderer replaces "build 200 pages."'
    script_or_component_1:
      path: src/app/(app)/reports/catalog/[reportId]/page.tsx
      purpose: 'ONE dynamic route. At request time: fetches the report_definitions row by id, branches
        purely on its `status` and `outputFormats` fields (not per-row custom code): status=built + outputFormats
        includes "table" -> renders via a shared <ReportTableView> reading from the `executionConfig`-referenced
        data source; +chart -> additionally renders a <recharts> chart component parameterized by `executionConfig`;
        status=data_gap -> renders a real, honest "data not available yet -- <dataGapNote>" state (reads
        the row''s own dataGapNote column, does not fabricate content); status=planned -> renders "coming
        soon" from the row''s own metadata. This single component handles all 200 rows -- zero per-report
        scaffolding.'
    script_or_component_2:
      path: src/app/(app)/reports/catalog/page.tsx
      purpose: One catalog index page, grouped by `category`, listing all 200 rows with their live `status`
