  stated_as: shares the Context Optimizer concept, build once
  concrete_mechanism: 'Concretely: PLAN-13''s "VERIDIAN Context Optimizer" (browser-side: trims/dedupes/compresses
    what gets sent FROM the browser) and PLAN-14''s "Context Optimizer" (server-side: trims/dedupes what
