- id: PLAN-06
  title: 3-round audit process, turned into a reusable checklist artifact -- DEEP-DIVE REPLACEMENT
  verified_current_state: 'This item needed no new investigation (per scope) -- it needed the existing,
    already-proven 3-round-audit convention (used for the 2026-07-18 credit-governance work) turned into
    a literal, reusable artifact. That convention, reconstructed from this session''s own established
    practice and the plan''s own meta.guardrails_applied note ("verification.self_certification is forbidden
    per STANDING_DIRECTIVE.yaml"), is: Round 1 = fresh-eyes audit against the ORIGINAL objective (not
    the implementer''s own summary of what they did), listing every gap found, however small. Fix. Round
    2 = re-audit ONLY what changed from Round 1''s fixes, PLUS a spot-check that nothing else regressed.
    Fix. Round 3 = final, zero-tolerance audit, explicit sign-off. Round 4 (meta) = audit the audit PROCESS
    itself -- were rounds 1-3 run with genuine independence (e.g., a different agent/context per round,
    not the same agent grading its own prior round), not just three passes by the same biased reviewer.'
  automation_mechanism: The literal reusable artifact is the checklist file below. Where automatable,
    each round's checks reference a script rather than a human eyeballing a screen (e.g. Round 1's "does
    this module's dispatch actually write to the DB" check runs smoke-test-new-actions.mjs from PLAN-02,
    not a manual click).
  reusable_artifact:
    path: ai-os/templates/3-ROUND-AUDIT-CHECKLIST.yaml
    exact_schema: "audit_subject: <task id being audited, e.g. PLAN-02>\nsource_of_truth: <link to the\
      \ ORIGINAL objective/spec, not the implementer's summary>\nround_1_fresh_eyes:\n  reviewer: <must\
      \ be a different agent/session than the implementer>\n  checks:\n    - \"Every claim in the implementer's\
      \ completion report has a corresponding automated-script output or live-query result attached (no\
      \ bare prose claims accepted)\"\n    - \"Every new codeReference/action has a passing smoke-test-new-actions.mjs\
      \ (or module-equivalent) result, not just 'looks right in the code'\"\n    - \"tsc --noEmit and\
      \ the full existing test suite both pass, re-run fresh by the reviewer, not trusted from the implementer's\
      \ last run\"\n  output: list of gaps found, however small, with file:line evidence per gap\n  gate:\
      \ \"if any gap found -> fix -> do not proceed to round_2 until fixes are re-verified by the SAME\
      \ round_1 checks\"\nround_2_delta_plus_regression_spot_check:\n  reviewer: <may be same or different\
      \ from round_1, but must independently re-run checks, not just re-read round_1's notes>\n  checks:\n\
      \    - \"every round_1 gap is now closed, with fresh evidence (not the implementer's say-so)\"\n\
      \    - \"spot-check 2-3 adjacent areas NOT touched by the fix, to catch regressions\"\n  output:\
      \ list of any remaining/new gaps\n  gate: \"same as round_1 -- fix, re-verify, do not proceed until\
      \ clean\"\nround_3_final_zero_tolerance:\n  reviewer: <ideally the most senior/independent reviewer\
      \ available>\n  checks:\n    - \"full re-run of every automated check from round_1 and round_2\"\
      \n    - \"explicit written sign-off statement, naming the reviewer and timestamp\"\n  output: \"\
      PASS or FAIL, with the same file:line evidence standard as round_1 -- no 'looks good to me' without\
      \ attached evidence\"\n  gate: \"FAIL -> back to round_1 for the failing item specifically, not\
      \ a full restart of everything\"\nround_4_meta_audit_of_the_process:\n  checks:\n    - \"were round_1/2/3\
      \ reviewers actually independent of the implementer and of each other, or was this 3 passes by the\
      \ same person/context self-grading?\"\n    - \"does every gap/fix/sign-off in rounds 1-3 have a\
      \ corresponding ai-os/boss/COMPLETED.yaml entry, so the audit trail is machine-checkable later,\
      \ not just this session's memory?\"\n  output: \"confirms or denies the process itself met STANDING_DIRECTIVE.yaml's\
      \ no-self-certification rule\"\n"
  step_by_step_plan:
  - 1. Write ai-os/templates/3-ROUND-AUDIT-CHECKLIST.yaml with the exact schema above (this is the literal
    deliverable this task asked for).
  - 2. For each of PLAN-01..05, once its COMPLETED.yaml entry exists (per the dependency_table's PLAN-01..05
    -> PLAN-06 mechanism), instantiate one copy of the checklist with audit_subject set to that plan id,
    and run rounds 1-4 against it.
  - 3. Each round's reviewer must be a genuinely separate agent/session invocation, not the same context
    re-reading its own prior output -- this is the one non-negotiable, evidence-backed requirement from
    this session's own precedent (self_certification forbidden per STANDING_DIRECTIVE.yaml).
  - 4. Store each completed round's checklist instance under ai-os/boss/audits/<PLAN-ID>-round-<N>.yaml
    so the trail is queryable later, not just narrated in chat.
  effort_reestimate: small -- the artifact itself is a template (already fully specified above); the actual
    per-round audit work is proportional to whatever PLAN-01..05 produced, done 5 separate times (once
    per plan item), not once.
