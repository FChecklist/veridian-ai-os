    depends on PLAN-13 only for a SHARED TYPE CONTRACT (a `ContextChunk[]` / `OptimizedContext` TypeScript
    type exported from one shared package, e.g. veridian-ui-kit or a new `@fchecklist/ai-context` package),
    not shared runtime code. Verify this at execution time (as the existing plan text already flags) by
    writing the type contract FIRST, before either optimizer''s implementation, and having both sides
    import it.'
