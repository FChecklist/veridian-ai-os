- edge: PLAN-09 -> PLAN-02
  stated_as: need real task-execution instrumentation points across modules first
  concrete_mechanism: 'PLAN-02''s own known_state names the real choke point already: src/lib/task-execution-engine.ts''s
    dispatchTool(db, orgId, userId, codeReference, context?) -- a single function, called from every module
