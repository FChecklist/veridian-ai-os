  stated_as: same 'VERIDIAN Browser SDK' name, should share one implementation
  concrete_mechanism: 'PLAN-12''s Priority 1 ("measure first") concretely means: install @vercel/speed-insights
    + @vercel/analytics (BOTH confirmed NOT_PRESENT in package.json -- see PLAN-12/13 section), wire <SpeedInsights
