brand_architecture_model:
  principle: ONE backend, ONE set of modules/engines, MANY brands. Brands never get their own copy of any engine/module
    -- they all call the exact same VERIDIAN AI OS core described in layer_1_veridian_ai_os below.
  what_varies_per_brand_or_segment:
  - organization-level configuration (which org row a brand's customers belong to)
  - end-user experience/personalization (terminology, look-and-feel content, which modules are exposed)
  - business rules (customizable per organization/segment)
  - workflows (customizable per organization/segment)
  what_never_varies:
  - the underlying engines (workflow engine, business rule engine, calculation engine, etc. -- one copy, shared)
  - UI/UX design system (same interface framework across every brand)
  - the fact that everything executes inside VERIDIAN AI OS -- no brand has its own separate backend
  invisibility_principle: the end user is never meant to know they are using VERIDIAN. Their only visible touchpoint
    is VERI (Your Assistant) and VERI Chat, presented under whichever brand they belong to.
  interaction_model: end user states a task/intent; VERIDIAN AI OS (software + AI, per the existing software-first/AI-second
    governance rule) completes the work end-to-end.
  human_facing_priority: Owner explicitly flagged communication, visual representation, dashboards, reports, and
    analysis as VERY IMPORTANT for human usage -- this elevates the priority of the two engines already found PARTIAL
    in this file (reporting_engine, dashboard_engine) above other partial items; they are not just 'nice to have'
    polish.
  verification_status:
    organization_level_scoping: CONFIRMED REAL -- organisations table + org-scoped access already verified this
      session
    per_organization_business_rule_customization: NOT YET VERIFIED -- business_rule_engine was confirmed to exist,
      but whether its rules are actually configurable per-organization (vs one global rule set) has not been checked.
      This is the single most important open technical question this new brand model raises.
    per_organization_workflow_customization: NOT YET VERIFIED -- same open question as above, for workflow_engine.
local_machine_policy_finding_2026_07_22:
  trigger: Owner asked about a file path on the local Windows machine (C:\Users\Dell\Downloads\Claude Code\ai-os\...),
    which should not exist under the 'thin client only, SSH-only' standing rule.
  finding: 'confirmed real: dozens of full repository clones and git worktrees exist locally under C:\Users\Dell\Downloads\Claude
    Code (compliance-tracker-wt-*, projexa-wt-*, subagent-*, verify-*, etc.) -- consistent with the known 2026-07-16
    finding that isolation:''worktree'' dispatches run real local compute, which the standing rule was written specifically
    to stop.'
  severity: the local tree is large enough that two independent search tools (a full recursive find, and the ripgrep-backed
    Glob tool) both timed out attempting to locate one specific filename in it -- the scale itself is evidence of
    the problem, independent of whether that exact file is present.
  not_yet_done: did not confirm whether the specific STRATEGIC_PLAN_2026-07-21_v2.yaml file exists locally or, if
    it does, whether it matches or has diverged from the real server copy -- inconclusive, not a false negative,
    the search itself did not finish
  recommended_next_step: a proper inventory of what's actually in C:\Users\Dell\Downloads\Claude Code needs a scoped,
    deliberate pass (e.g. list top-level dirs with sizes and last-modified dates, decide what's safe to delete vs
    what holds real uncommitted work) rather than another ad-hoc timed-out search -- separate task from this architecture
    consolidation, flagged here so it is not lost.
