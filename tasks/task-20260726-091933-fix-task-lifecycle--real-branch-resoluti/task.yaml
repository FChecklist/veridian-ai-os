- Discovered scripts/supervisor-entrypoint.sh and scripts/veridian-task.py were never
  actually tracked in claude-control git history (live-only, per ai-os/SCRIPTS_LIVE_VS_REPO_DRIFT_AUDIT_2026-07-25.yaml's
  "core orchestration code with 0 commits" finding) -- brought both into git tracking
  from their live content at /opt/veridian/scripts/ (byte-identical, verified via
  diff) as the baseline for this task's edits.
- Found an earlier, incomplete attempt at this same task (branch worker/task-20260726-083946-fix-task-lifecycle--real-branch-resoluti,
  checkpoint commit 6efac81, "invocation failed, exit 1"). Independently reviewed
  its tight_task_validation.py and task-gateway.py diffs and both test files; verified
  them against the current live baseline (hashes matched exactly) and adopted them
  since they were sound. That attempt never actually implemented the veridian-task.py
  or supervisor-entrypoint.sh changes -- those are original to this task.
- 'Gap 1 (real branch resolution): scripts/veridian-task.py''s cmd_checkpoint() now
  reads the workspace''s real current branch (`git rev-parse --abbrev-ref HEAD`) and
  updates task["branch"] before saving, so a corrective task whose prompt instructed
  it to push to a different pre-existing branch is handed off correctly to supervisor-entrypoint.sh
  (which already read task.yaml''s ''branch'' field unchanged -- no new field needed).'
- 'Gap 2 (HOLD_FOR_OWNER_SIGNOFF): scripts/tight_task_validation.py extracts a real
  `HOLD_FOR_OWNER_SIGNOFF: true` marker line from EXPECTED_OUTPUT/CONSTRAINTS; scripts/task-gateway.py''s
  cmd_start() threads it through to scripts/veridian-task.py''s cmd_create() (--hold-for-owner-signoff),
  which writes hold_for_owner_signoff into task.yaml; scripts/supervisor-entrypoint.sh''s
  merge-decision block reads it FIRST and skips auto-merge unconditionally when true,
  posting a PR comment, checkpointing awaiting_human_approval, and notifying the Owner.'
- Added tests/hold_for_signoff_test.py and tests/veridian_task_branch_resolution_test.py,
  both testing the real shipped code (subprocess/importlib against the actual scripts,
  no reimplementation). `python3 -m pytest tests/ -k "branch_resolution or hold_for_signoff"
  -v` -- 7 passed. Full suite (`python3 -m pytest tests/`) -- 18 passed, no regressions.
- Re-ran the two existing shell regression tests (supervisor_merge_detection_test.sh,
  supervisor_audit_rerun_test.sh) against the edited supervisor-entrypoint.sh -- both
  still pass, confirming the new HOLD-FOR-OWNER-SIGNOFF-BLOCK wrapping didn't disturb
  the existing tier1/tier2/scope/reject logic.
- Updated ai-os/OWNER_DIRECTIVES/PROTOCOL_OWNER_AI.yaml (article A15_hold_for_owner_signoff)
  documenting the mechanism and the PR563 real incident, confirmed via scripts/check_single_protocol_file.py
  as the one canonical protocol file.
- 'Opened PR #81 against claude-control (https://github.com/FChecklist/claude-control/pull/81).
  Not merged -- Owner merges. PR body flags two known conflicts with parallel work:
  PR #80 (task-20260726-083833) adds its own new article at the same insertion point
  in PROTOCOL_OWNER_AI.yaml (both A15_...); and task-20260726-082342''s DDL pre-flight
  gate is expected to also edit task-gateway.py''s cmd_start().'
remaining_steps: &id003
- None -- task complete, awaiting Owner PR review/merge.
