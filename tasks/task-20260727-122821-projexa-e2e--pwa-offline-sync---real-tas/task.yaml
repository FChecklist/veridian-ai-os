- 'compliance-tracker: pms-issue-service.ts -- updateIssue() now checks pmsIssueRelations
  before allowing a transition into a "completed"-group status (rejects with a specific
  409 ServiceError naming the incomplete predecessor); addIssueRelation() rejects
  a new blocks/blocked_by edge that would immediately leave an already-completed successor
  with an incomplete predecessor. No-relation issues (the common case) are untouched.
  Pure edge-normalization logic extracted as exported `predecessorIdsOf()`.'
- 'compliance-tracker: src/lib/services/pms-issue-service.test.ts -- 7 bun:test cases
  for predecessorIdsOf() (matches this repo''s existing convention of testing pure
  logic, not withTenantContext/live DB, in .test.ts files -- no test-DB harness exists
  in this environment). `bun test` passes (7/7), `npx tsc --noEmit` clean (needed
  NODE_OPTIONS=--max-old-space-size=6144 -- default heap OOMs on this repo''s full
  project graph).'
- 'PROJEXA: src/app/manifest.ts -- Next.js native manifest route, adapted from compliance-tracker''s
  real working manifest.ts (same mechanism), PROJEXA''s own branding/colors (verified
  against globals.css''s real --background/--foreground tokens), no share_target (that''s
  VERI Chat-specific, doesn''t apply to PROJEXA).'
- 'PROJEXA: public/sw.js -- hand-written service worker (justification in the file''s
  own header comment: no next-pwa/workbox dependency exists in this repo today, and
  a small first-party SW matches this codebase''s general convention over adopting
  a heavy build-plugin). Network-first navigations with app-shell cache fallback,
  cache-first for static GETs, explicitly bypasses /api/* (offline queue''s job, not
  the SW''s -- avoids silently serving stale org/project data). Registered from src/components/ServiceWorkerRegister.tsx,
  mounted in src/app/layout.tsx.'
- 'PROJEXA: src/lib/offline/work-progress-queue.ts -- idb-keyval-backed (added as
  a new dependency, confirmed not already present anywhere in the monorepo) local
  queue for work-progress entries (quantity/percent/remarks/photo Blob). "Always queue,
  sync opportunistically" design: every submission enqueues first, then syncs immediately
  if online; an `online` event listener drains the queue on reconnect. Wired into
  src/components/WorkProgressClient.tsx with a real, visible amber "N entries queued,
  will sync" panel (not silent), a manual "Sync now" button, and a photo file input
  on the Log Progress dialog.'
- '`npx tsc --noEmit` clean on PROJEXA (also needed the increased heap).'
- 'PROJEXA: e2e/offline-work-progress-sync.spec.ts written (real Playwright spec:
  context.setOffline(true), log progress, assert the real "queued, will sync" panel
  + queue-item content, assert nothing landed server-side yet; context.setOffline(false),
  assert the queue drains via the real `online` listener, reload, assert the entry
  now appears in the real entries table). **NOT executed against the live site**:
  confirmed via a direct `curl https://projexa-ai.com/login` during this task that
  it still serves compliance-tracker''s own login UI, not PROJEXA''s (the exact pre-existing
  prod routing bug the immediately-prior PR (8cf5cab) already documented and was blocked
  by) -- auth.setup.ts''s real login flow can''t complete for ANY spec in this suite
  right now, not something specific to this feature. No local dev server alternative
  either: this checkout has no NEXT_PUBLIC_SUPABASE_URL/ANON_KEY env vars, so `next
  dev` can''t authenticate locally.'
- 'PROJEXA: src/lib/offline/work-progress-queue.test.ts -- real substitute proof (same
  honest-substitution pattern as 8cf5cab), exercising the ACTUAL production work-progress-queue.ts
  module against a real IndexedDB (fake-indexeddb, added as a new devDependency --
  this is real browser-local storage, not a "live backend", so it''s a different case
  from this repo''s live-DB-test exclusion convention). 5 tests: enqueue persists
  a real record; sync-while-offline leaves it queued with status ''error'' (not silently
  dropped); sync-once-reconnected POSTs the real payload shape to /api/work-progress
  and empties the queue; a previously-failed entry retries and lands on the next sync;
  a real photo Blob round-trips through IndexedDB. `bun test src` -- 26/26 pass repo-wide
  (note: bare `bun test` also picks up e2e/*.spec.ts and fails on all of them with
  a pre-existing, unrelated Playwright/bun-test harness conflict -- confirmed this
  predates this task''s changes; `bun test src` is the correct unit-test scope).'
- 'PWA manifest validity check: `bun run build` succeeded for real (production build),
  `/manifest.webmanifest` compiled as a static route. Started the real built server
  (`bun run start`, dummy Supabase env vars only to get past middleware''s client-construction
  guard -- the manifest route itself needs no auth) and curled it for real: `GET /manifest.webmanifest`
  -> HTTP 200, valid JSON with all Web-App-Manifest installability fields present
  (name, short_name, start_url, display:"standalone", theme_color, background_color,
  icons with real sizes/type) matching the real logo-mark.svg in public/; `GET /sw.js`
  -> HTTP 200. A full Lighthouse CLI PWA-category run was attempted (`npx lighthouse
  ... --only-audits=installable-manifest,service-worker,...`) but did not complete
  cleanly in this headless/sandboxed environment (Chrome launch friction) within remaining
  budget -- the curl-verified real 200s + valid manifest JSON + successful production
  build are the executed, real verification; full Lighthouse automation is a disclosed
  gap, not claimed as done.'
