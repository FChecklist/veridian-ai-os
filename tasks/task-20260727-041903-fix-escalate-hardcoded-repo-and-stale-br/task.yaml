last_checkpoint_at: '2026-07-27T04:42:28.835526+00:00'
completed_steps: &id002
- 'Confirmed live: `escalate()` in scripts/veridian-task-watchdog.py hardcoded `--repo
  claude-control` for every auto-escalated rca- task, ignoring the stalled task''s
  real repo (2 historical instances, both really compliance-tracker).'
- Fixed `escalate()` to read the stalled task's own already-loaded task.yaml `repo`
  field and pass that to `veridian-task.py create`, falling back to `claude-control`
  only if it's genuinely unknown.
- 'Root-caused the real, reproducible mechanism behind the observed `branch: master`
  values (NOT a guess -- verified with a live git repro): `cmd_create`''s `git worktree
  add -b <branch> workspace origin/<default>` checks the new branch out from a remote-tracking
  ref, and git''s own `branch.autoSetupMerge` default means that branch''s `@{upstream}`
  points at `origin/<default>` (e.g. `origin/master`) from the instant it''s created,
  before any commit or push. `cmd_checkpoint`''s real-branch-resolution code (added
  2026-07-26 for the PR561/562/78 fix) trusted `@{upstream}` unconditionally, so any
  checkpoint before the first real `git push -u origin <branch>` (the very first in_progress
  checkpoint, or any checkpoint on a task that never gets past pre-flight -- exactly
  what happened to both stuck rca- instances, permanently pre-flight-rejected on crontab_unauthorized_change)
  overwrote task.yaml''s `branch` field with the repo''s own default branch name.
  Confirmed with a standalone git repro (checkout -b from origin/master, no push:
  `@{upstream}` resolves to `origin/master` immediately) and with a test that fails
  on the pre-fix code and passes after the fix.'
- 'Fixed `cmd_checkpoint` in scripts/veridian-task.py: it now also computes the workspace''s
  real default branch and refuses to trust an `@{upstream}`-derived branch name that
  equals it (never a legitimate real target branch for a worker''s own PR in this
  workflow) -- falls back to the local HEAD branch name instead, which is always a
  real, meaningful value (satisfies option (a) in the task SPEC; no change to supervisor-entrypoint.sh''s
  null-handling was needed since the branch field is never actually unset/wrong now).'
- 'Extended tests/veridian_task_branch_resolution_test.py (not a new parallel file)
  with:'
- '`python3 -m pytest tests/veridian_task_branch_resolution_test.py -v` -- all 6 pass
  (3 pre-existing + 3 new).'
- Full existing test suite (`tests/`, all .py + .sh) re-run -- no regressions (90
  pytest tests + 5 shell scripts, all pass).
remaining_steps: &id003
- Commit + push branch, open PR against origin/master on claude-control.
- Confirm PR merged via `gh pr view --json state,mergedAt` (not a self-report).
- 'Confirm the merged fix is actually deployed: `diff` scripts/veridian-task-watchdog.py
  and scripts/veridian-task.py against the live /opt/veridian/scripts/ copies.'
- 'Final checkpoint: status=pending_review, with the root-cause note above.'
