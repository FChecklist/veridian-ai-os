- Read `ai-os/OWNER_DIRECTIVES/interactive-session-guard.bashrc-snippet` in full;
  confirmed round-3 fixes still hold.
- 'Reproduced live: `git -C /tmp push origin master`, `git --git-dir=/tmp/.git push
  origin master`, `gh --repo some/repo pr merge 1 --merge` all bypassed argv[1]-only
  detection.'
- Researched real git 2.43 / gh 2.45 global-flag sets from `man git` / `gh <cmd> --help`
  and confirmed argument forms live (space vs `=`, attached short flags, which forms
  error out).
- Rewrote git wrapper detection (`_interactive_guard_git_find_subcommand()`) to scan
  the full argv and skip real global flags before finding the subcommand.
- Rewrote gh wrapper detection (`_interactive_guard_gh_strip_globals()`) to skip `-R`/`--repo`
  (all 4 forms) + `--help`/`--version`.
- Updated `_interactive_guard_git_push_verdict()` to carry the skipped global-flag
  prefix through to the `symbolic-ref` current-branch lookup.
- 'Empirically tested systemd-run impersonation on VERIDIAN-DEV: `systemd-run --user
  --unit=veridian-worker@<fake>.service --scope ...` is currently rejected by systemd
  itself (collides with the real installed template units) -- confirmed this is a
  name collision, not systemd-run being broken (an unrelated unit name succeeds with
  a real cgroup+INVOCATION_ID).'
- 'Implemented signal 3 (task cross-reference) regardless, since the collision is
  deployment-specific/incidental, not fundamental: `_interactive_guard_tasks_dir()`
  (hardcoded, no override) + cross-reference requiring a real, in_progress `/opt/veridian/ai-os/tasks/<task_id>/task.yaml`.'
- Manually verified all new logic against real git/gh binaries and simulated forged/real/wrong-status
  cgroup scenarios.
- Updated KNOWN LIMITATIONS honestly.
- Updated `ai-os/OWNER_DIRECTIVES/PROTOCOL_OWNER_AI.yaml` A15 article to match round
  4.
- Extended `tests/interactive_session_guard_test.sh` with ROUND 4 regression scenarios
  (argv-bypass cases + forged-cgroup-no-matching-task + wrong-status cases), updated
  fixtures for the new tasks-dir patch point. 65/65 scenarios pass.
- 'Added `tests/write_gate_test.py` pytest wrapper. `python3 -m pytest tests/ -k write_gate
  -v` exits 0 (and full `tests/` suite: 12/12 pass).'
- Ran unrelated shell suites (supervisor_audit_rerun, supervisor_merge_detection,
  worker_noop_pending_review) to confirm no collateral regression -- all pass.
- 'Committed (`353fa09`) and pushed to PR #80 branch (`worker/task-20260726-083833-build-interactive-session-write-gate--re`),
  rebased onto latest remote tip.'
