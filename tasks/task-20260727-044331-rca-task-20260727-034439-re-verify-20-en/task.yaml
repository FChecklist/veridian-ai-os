completed_steps: &id002
- "Read task-20260727-034439's task.yaml, worker.log, systemd.log; confirmed its own\
  \ quality-gate phase was a legitimately slow/hung `next build` (a separate defect,\
  \ already fixed live by sibling task-20260727-043407 via a `timeout` wrapper in\
  \ scripts/quality-gate.sh \u2014 verified that fix is present)."
- 'Found the REAL, distinct root cause of the "stalled or looping" watchdog escalation
  itself: scripts/veridian-task-watchdog.py''s `escalate()` had no dedup check before
  creating a new RCA task. Confirmed live: 7 separate `veridian-worker@*rca-task-20260727-034439*`
  units were active simultaneously, one new escalation almost every ~60s watchdog
  tick, for the identical "periodic checkpoint" signature.'
- "Found the reason no prior fix ever took effect despite 13 recorded \"successes\"\
  : `known_fixes` already had a row (signature=\"periodic checkpoint\", fix_action=\"\
  skip_escalation_when_activating\", since 2026-07-26) whose name describes exactly\
  \ the missing dedup behavior, but that action name was never implemented in `FIX_ACTIONS`\
  \ \u2014 `apply_known_fix()` fell into the \"unrecognized action name, no automated\
  \ action taken\" branch every time, and `process_task()` still unconditionally escalated\
  \ afterward. `record_fix_applied()` was also being called even for unrecognized\
  \ actions, inflating `success_count` and masking that the fix never engaged."
- "Found a second bug compounding the first: `known_fix = lookup_known_fix(signature)\
  \ if found else None` gated the known_fixes lookup (step_2) behind `search_prior_occurrence()`\
  \ (step_1, ATTENTION.md/task_audits text search) succeeding \u2014 this task's own\
  \ escalation happened with `found=False`, so the known_fixes row was never even\
  \ consulted."
- "Real fix applied directly to `/opt/veridian/scripts` (shared server infra, not\
  \ part of any repo \u2014 same location the OOM and hung-build fixes for this signature\
  \ already live):"
- 'Verified: `python3 -m py_compile` on both files; a monkeypatched unit test of `find_active_rca_for()`
  and `escalate()`''s dedup skip path; `veridian-task.py create --help` confirms `--rca-target-id`
  is wired.'
- "Registered the fix: `python3 scripts/superboss-register.py log-fix --signature\
  \ \"periodic checkpoint\" --fix-action \"skip_escalation_when_activating\"` \u2192\
  \ `known_fixes` row now has `success_count=17` (this row already existed since 2026-07-26;\
  \ this run confirms it, and the fix_action name is now backed by real code for the\
  \ first time)."
remaining_steps: &id003
- "Out of this task's scope, reported not fixed: 6+ duplicate `rca-task-20260727-034439*`\
  \ worker units were left running by the pre-fix escalation storm. **Re-verified\
  \ 2026-07-28 (invocation 2):** `systemctl list-units 'veridian-worker@*rca*' --all`\
  \ now returns 0 loaded units \u2014 the duplicate workers have drained/exited on\
  \ their own since invocation 1's checkpoint; nothing left to clean up."
