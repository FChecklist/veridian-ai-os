completed_steps: &id002
- Read `ai-os/boss/ACTIVE-CLAIMS.yaml`, `ai-os/CONSTITUTION.yaml` context, and registered
  this session's claim before starting work.
- 'Investigated the gap live rather than trusting the finding text: confirmed `recordPromptCacheMetric()`
  (`src/lib/prompt-cache/metrics.ts`), called from `chat-service.ts`''s `generateAiReply()`,
  wrote only to `prompt_cache_metrics` (an observability table) and never touched
  `token_usage_ledger` (the table `cost-guard.ts`/`getTokenUsageSummary()` actually
  read for Finance/cost-cap purposes). The gap description matched current code --
  not already resolved.'
- Added `estimateCacheSavingsUsd(model, usage)` to `src/lib/llm-client.ts` -- computes
  real $ saved from Anthropic prompt-cache reads (documented 90% discount on cache-read
  tokens), returning `null` when caching wasn't attempted or the model has no pricing
  row (same "absence means not attempted" contract as `cacheReadTokens` itself).
- Added `cache_savings_usd` nullable numeric column to `token_usage_ledger` (`src/lib/db/schema.ts`
  + `drizzle/0225_token_usage_ledger_cache_savings.sql`).
- '`logTokenUsage()` (`src/lib/services/token-usage-service.ts`) now computes and
  stores `cacheSavingsUsd` on every row via `estimateCacheSavingsUsd`.'
- '`recordPromptCacheMetric()` now also calls `logTokenUsage()` (scope `product_orchestra`)
  alongside its existing `prompt_cache_metrics` write, so this call site''s real spend
  *and* its cache savings both land in the ledger Finance actually reads. `chat-service.ts`''s
  one call site updated to pass `userId` through.'
- '`getTokenUsageSummary()` now surfaces `totalCacheSavingsUsd` plus a `cacheSavingsUsd`
  column on every grouped row (by scope/role/model/org), so the savings are visible
  in the existing Finance report (`/api/ai/team/token-usage`), not just a column nobody
  queries.'
- Added regression tests for `estimateCacheSavingsUsd` in `src/lib/llm-client.test.ts`
  (null when not attempted, 0 for cache-creation-only calls, correct 90%-discount
  math, null for unpriced models).
- 'Verified: full test suite 1328 pass / 0 fail, `tsc --noEmit` clean, `eslint` 0
  errors, `scripts/check-guardrail-presence.mjs` 88/88 markers present.'
- Registered claim in `ai-os/boss/ACTIVE-CLAIMS.yaml`.
