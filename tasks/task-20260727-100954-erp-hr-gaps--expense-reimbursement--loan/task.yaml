  project connected in this session; the MCP server requires interactive OAuth authorization
  this non-interactive session cannot complete). RLS+FORCE+policies were hand-written
  to mirror `drizzle/0050`''s already-audited pattern exactly, but the SUCCESS_CRITERIA''s
