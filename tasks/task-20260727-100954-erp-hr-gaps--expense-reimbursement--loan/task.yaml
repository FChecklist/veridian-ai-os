  to run before/at merge.'
- Push commits, open the PR, and get the mandatory independent audit-verdict comment
  (AGENTS.md Rule 6/7(c)/10) -- this session must not self-merge.
- 'Optional follow-up (not required by this task''s SUCCESS_CRITERIA, noted honestly):
  no UI screens were built for any of the 4 features (API + service + schema only,
  matching this task''s own SCOPE wording) -- a real, separate future gap if the Owner
  wants employee-facing UI for these before the next HR wave.'
