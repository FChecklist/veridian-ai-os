completed_steps: &id002
- Registered claim in `ai-os/boss/ACTIVE-CLAIMS.yaml` before starting (no conflicting
  active claims found).
- Fixed the stale `hr-service.ts:1-6` "Payroll deliberately out of scope" comment
  (was already wrong -- `erp-payroll-service.ts` is a real, live payroll engine).
- '**Gap 1: Employee expense claims/reimbursement.** New `hrExpenseClaims` table (schema.ts),
  `hr-expense-service.ts` (create/list/decide), `src/app/api/hr/expenses/route.ts`
  + `[id]/route.ts`. Payroll integration decision: an approved-but-unpaid claim is
  picked up by `processPayrollRun()` as a real payslip **earning** line (not a separate
  payment record) -- reuses the existing payslip/net-pay machinery, documented in
  schema.ts''s own comment.'
- '**Gap 2: Employee loans/salary advances.** New `hrEmployeeLoans` + `hrLoanInstallments`
  tables, `hr-loan-service.ts` (request/approve-generates-full-schedule/reject), `src/app/api/hr/loans/route.ts`
  + `[id]/route.ts` + `[id]/installments/route.ts`. Payroll integration: `processPayrollRun()`
  deducts the earliest still-pending installment on every processed run (one per run,
  in installment-number order -- documented simplification, does not match calendar
  dueMonth/dueYear against the run''s own month/year), decrements `outstandingBalance`,
  closes the loan at 0.'
- '**Gap 3: KRA/weighted-goal + multi-rater (360) appraisal.** Extended (not replaced)
  `performanceReviews`/`performance-service.ts`: new `performanceReviewGoals` (per-goal
  weight+rating, `computeWeightedScore` pure helper enforces weights sum to 100),
  new `performanceReviewRaters` (peer/subordinate/other, additive to the existing
  self+manager pair), new nullable `performanceReviews.weightedScore` column (computed
  on submit only if goals exist -- zero-goal reviews unchanged). Routes: `.../reviews/[id]/goals/route.ts`
  + `[goalId]/route.ts`, `.../reviews/[id]/raters/route.ts` + `[raterId]/route.ts`.'
- '**Gap 4: Shift management/roster.** New `hrShiftTypes` + `hrShiftRosterAssignments`
  tables, `hr-shift-service.ts` (`resolveShiftForDate` pure helper + CRUD), new nullable
  `hrAttendanceRecords.shiftTypeId` column -- `checkIn`/`markAttendance` in `hr-attendance-service.ts`
  now snapshot the resolved expected shift at write time. Routes: `src/app/api/hr/shifts/route.ts`
  + `roster/route.ts`.'
- Drizzle migration `drizzle/0264_hr_gap_closure_expense_loan_appraisal_shift.sql`
  (all 7 new tables + 2 additive columns, org-scoped RLS+FORCE+policies+grants+indexes,
  matching drizzle/0050's own pattern) + `drizzle/meta/_journal.json` entry.
- '`ai-os/registry/asset-registry-coverage.yaml`: all 7 new tables given an explicit
  `exempted` decision with a real per-table reason (sensitive per-employee financial/performance
  data, or a ledger/log record with no genuine display-name column -- same classes
  as the already-exempted `performance_reviews`/`hr_attendance_records`/`crm_stage_history`).'
- '`ai-os/registry/terminology-guardrail-exemptions.yaml`: 8 new files given real
  per-file exemption entries (dated changelog-comment + test-fixture-date-literal
  false positives, same class Phase 2 already established for this directory).'
- 'Tests: `hr-loan-service.test.ts`, `hr-shift-service.test.ts`, `hr-expense-service.test.ts`,
  `erp-payroll-service.test.ts` (proves a processed payroll run reflects both the
  loan deduction and the expense reimbursement, per this task''s own SUCCESS_CRITERIA),
  `performance-service.test.ts` -- all pure-function tests (no live DB in `.test.ts`,
  matching this repo''s established convention).'
- 'Verification: `bun test` -- 2073 pass / 0 fail (full suite, no regressions) + 63
  pass / 0 fail (new + touched files run standalone). `bunx tsc --noEmit` -- 0 errors,
  full repo. `check-asset-registry-coverage.mjs`, `check-terminology-guardrail.mjs
  --diff-only`, `check-guardrail-presence.mjs` -- all pass.'
remaining_steps: &id003
