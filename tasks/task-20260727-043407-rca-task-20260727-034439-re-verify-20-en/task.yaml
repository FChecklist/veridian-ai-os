completed_steps: &id002
- 'Read task-20260727-034439''s task.yaml/worker.log/systemd.log. worker.log ended
  immediately after `--- lint: exit 0 ---`, with nothing after -- no build/test output
  at all, despite the workspace''s package.json having a `build` script.'
- Confirmed the task's systemd unit was still `active (running)` 1h+ after start;
  process tree showed `bun run build` -> `next build` (PID 1205932) alive the whole
  time.
- 'Confirmed LIVE (not a guess) that `next build` was genuinely hung, not just slow:
  `/proc/1205932/status` showed `State: S (sleeping)`, `wchan: ep_poll`, and `utime`
  was identical across a 5-second sample (`13476` -> `13476`) -- zero CPU progress,
  sitting idle in its own event loop forever.'
- 'Root cause: `/opt/veridian/scripts/quality-gate.sh`''s `run_gate()` runs every
  gate command (`eval "$cmd"`) with **no timeout at all**. A hang in `lint`/`build`/`test`
  (or the un-gated `install` step) blocks the whole worker forever. This is a *different*
  failure mode from the 2026-07-26 OOM fix already present in this same file (that
  one crashed loudly and got restarted by systemd; this one never crashes or exits).
  Made worse by the 2026-07-26 checkpoint-heartbeat fix: the background `periodic
  checkpoint` loop only does cheap `git status`/`git log` against the workspace, which
  kept succeeding every ~5min regardless of the hung build -- so the task looked "healthy
  but slow" to `veridian-task-watchdog.py`''s `LOOP_EXCLUDED_NOTES` exemption for
  the literal string `"periodic checkpoint"`, instead of the permanent hang it actually
  was.'
- 'Confirmed `/opt/veridian/scripts/quality-gate.sh` is a live, untracked deployed
  script (not present in this repo''s `scripts/` dir) -- same situation as the precedent
  fix in `ai-os/patches/quality-gate-node-oom-memory-cap-2026-07-26.diff`. Followed
  the same convention: applied the real fix directly to the live file, and committed
  a matching patch file here as the audit trail.'
- 'Applied the fix: wrapped `run_gate()`''s command execution in `timeout -k 30 "$GATE_STEP_TIMEOUT_SECONDS"
  bash -c "$cmd"` (default 900s, overridable via env var) so a hang now fails that
  gate cleanly (feeds the existing auto-fix-then-blocked pipeline) instead of blocking
  forever. Also wrapped the un-gated `install` step the same way, closing the same
  class of risk there. See `ai-os/patches/quality-gate-run-gate-timeout-2026-07-27.diff`.'
- Verified the timeout wrapper works in isolation (a `sleep 30` gate under a 2s timeout
  was killed at exit 124 in ~2s).
- 'Unstuck the live stalled task: killed the hung `next build` process tree (SIGTERM
  then SIGKILL, since it did not respond to SIGTERM) for task-20260727-034439. Its
  own already-running worker instance then recovered through its **existing, unmodified**
  failure path: gate reported `build: exit 137`, its auto-fix attempt was rejected
  by `credit-accountant.py` ("existing software/mechanism already covers this"), and
  the task reached a clean terminal `status: blocked` (awaiting human review) instead
  of hanging indefinitely. No manual edits were made to that task''s own files.'
- Registered the fix in `known_fixes` via `python3 scripts/superboss-register.py log-fix
  --signature "periodic checkpoint" --fix-action quality_gate_run_gate_timeout` so
  this exact signature auto-resolves via the watchdog's step_2 lookup next time (though
  this particular root cause is not one `veridian-task-watchdog.py`'s `FIX_ACTIONS`
  whitelist can safely auto-remediate by restarting the unit -- the real fix already
  prevents recurrence at the source).
remaining_steps: &id003
- Owner/human merge of this PR (not done by this task).
- Human review of blocked task task-20260727-034439 itself (out of this task's scope
  -- its own quality-gate failure, now surfaced cleanly instead of hanging, needs
  a real fix to the `next build` in that workspace, or a rerun).
