- '`ai-os/MASTER_INDEX.yaml`: add a second registries entry for the new `src/lib/browser-execution/`
  engine itself (only the prior-art litert-spike entry was added so far).'
- '`ai-os/VERIDIAN_ARCHITECTURE_V2_PHASE_PLAN_2026-07-25.yaml` (claude-control repo,
  `/opt/veridian/repos/claude-control/`) phase_5 status has NOT been updated yet --
  still `not_started`. Do not mark `status: done` until the above items are complete
  and a real PR exists (see phase_4''s own corrected-status entry in that file for
  why: a prior session''s premature "done" claim citing an unmerged/conflicting PR
  was reverted -- don''t repeat that).'
- No PR opened yet for this branch (`worker/task-20260726-171420-phase5-browser-execution`).
  Only the ACTIVE-CLAIMS registration commit has been pushed so far; the browser-execution
