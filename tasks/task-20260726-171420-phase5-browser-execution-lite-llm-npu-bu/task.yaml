completed_steps: &id002
- Registered this session's claim in `ai-os/boss/ACTIVE-CLAIMS.yaml` before starting
  work.
- 'FIRST STEP per spec: registered `litert-spike` + `litert-spike-embeddings` prior
  art in `ai-os/MASTER_INDEX.yaml` (`litert_spike_prior_art` entry).'
- '**Key scoping finding** (avoided duplicate build): `src/components/veri-chat/VeriComposer.tsx`
  + `ChainSelector.tsx` already realize the Owner''s "dynamic mode pills + dynamic
  option chain" (Option 1) and free-text chat (Option 2) UX, already mounted in `(app)/home`.
  Did not build new duplicate input components.'
- 'Technology decisions made and justified (not silently kept LiteRT by default):
  WebLLM (`@mlc-ai/web-llm`) adopted for the Lite-LLM tier (LiteRT-LM.js is a separate,
  unevaluated product per `ai-os/MASTER-TRACKER.yaml` GAP-LITERT-EDGE-INFERENCE);
  Transformers.js (`@huggingface/transformers`) adopted for the embeddings/classification
  tier, sidestepping litert-spike-embeddings'' documented int64/dynamic-shape API
  blocker. Both added as real `package.json` dependencies.'
- '**Portability fix required for phase_2''s compiler to run in-browser at all**:
  extracted `estimateCostUsd`/`estimateCacheSavingsUsd`/`MODEL_PRICING`/`LLMUsage`
  out of `llm-client.ts` (a ~750-line, 5-provider server module) into a new dependency-free
  `src/lib/llm-pricing.ts`, re-exported unchanged from `llm-client.ts` for every existing
  call site. `src/lib/prompt-compiler/verification-pipeline.ts` now imports from `llm-pricing.ts`
  instead.'
- "Replaced Node's `crypto.createHash` (unavailable in a browser bundle) with a new\
  \ dependency-free, synchronous `src/lib/universal-hash.ts` (`sha256Hex`), verified\
  \ byte-for-byte against Node's own `crypto` for many inputs incl. block-boundary\
  \ edge cases (`universal-hash.test.ts`). Wired into `prompt-compiler/prompt-construction.ts`'s\
  \ `hashContent`/`computeFingerprint`. This was the real, concrete blocker preventing\
  \ phase_2's `runPipeline()` from executing client-side; confirmed the full call\
  \ chain (`pipeline.ts` \u2192 `context-assembly.ts`/`prompt-construction.ts`/`verification-pipeline.ts`/`confidence-engine.ts`/`intent-classifier.ts`/`entity-variable-extraction.ts`)\
  \ has zero remaining Node-only imports."
- 'Built `src/lib/browser-execution/` (new module, imports `prompt-compiler` submodules
  directly, never the barrel, since the barrel re-exports DB-backed/Node-crypto modules
  unsafe for a client bundle):'
- 'Found and fixed a real cross-test bug during verification: the in-memory cache
  fallback is module-scope and persisted across tests in the same file/process (since
  `contentHash` depends only on normalized text, not on tier-refined classification)
  -- added `resetInMemoryCacheForTests()` and wired it into `beforeEach` in the affected
  test files.'
remaining_steps: &id003
- '**Re-run the full `src/lib/browser-execution/` test suite after the cache-pollution
  fix above and confirm green.** The suite was run once before the fix (32 pass /
  7 fail, all 7 attributable to either the cache-pollution bug just fixed, or a one-time
  ~300s module-resolution cost `bun test` incurs the first time it statically analyzes
  the dynamic `import()` targets in `tier-runners.ts` for `@mlc-ai/web-llm`/`@huggingface/transformers`,
  tripping several unrelated tests'' default 5000ms timeouts). Needs a re-run (likely
  with a longer `--timeout`) to confirm the logic fix actually resolves it and to
  characterize the real one-time cost.'
- 'Wire `src/lib/browser-execution/`''s `runBrowserExecutionTiers()` into `VeriComposer.tsx`''s
  send/dispatch path as an additive pre-send step (per spec: "the browser-to-server
  handoff itself"). Not started -- `VeriComposer.tsx` is untouched this session.'
- Playwright proof (`e2e/browser-execution.spec.ts`) of capability-detection/fallback
  executing in a real headless-Chromium context, per this phase's own success_criteria
  ("A real command proving at least a 2-tier fallback... executes end to end in a
  browser context"). Not started. `@playwright/test` is already a devDependency; `e2e/`
  is currently empty.
- Full repo `tsc`/lint pass has NOT been run this session -- only the new/touched
