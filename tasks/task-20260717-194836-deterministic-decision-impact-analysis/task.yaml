  \ originally included the item's `kind` (e.g. `\"approval_request\"`) in the text\
  \ passed to the shared keyword detector, which meant every `approval_request`-kind\
  \ item spuriously matched the generic `\"approval\"` trigger (the word \"approval\"\
  \ inside \"approval_request\") *before* more specific `requestType` signals like\
  \ `policy_publish` \u2192 `compliance_submission` or `access_review_cycle` \u2192\
  \ `access_changes` could be checked. Fixed by excluding `kind` from the detection\
  \ text (kept only as the fallback default's conceptual justification, per its own\
  \ comment)."
