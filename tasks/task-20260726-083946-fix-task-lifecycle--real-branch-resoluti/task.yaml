completed_steps: &id002
- 'Discovered supervisor-entrypoint.sh and veridian-task.py are NOT tracked in this
  git repo at all (live-only at /opt/veridian/scripts/, confirmed via ai-os/SCRIPTS_LIVE_VS_REPO_DRIFT_AUDIT_2026-07-25.yaml).
  Followed the repo''s own sync-repos.sh precedent: pulled live content into git verbatim
  as the base, then extended.'
- 'Gap 1 fix: veridian-task.py''s cmd_checkpoint() now resolves the real current git
  branch (`git -C $WORKSPACE rev-parse --abbrev-ref HEAD`) and updates task.yaml''s
  ''branch'' field at the pending_review handoff point, instead of trusting the stale
  creation-time value.'
- 'Gap 2 fix: tight_task_validation.py parses a real `HOLD_FOR_OWNER_SIGNOFF: true`
  marker from EXPECTED_OUTPUT/CONSTRAINTS (extract_hold_for_owner_signoff()); task-gateway.py''s
  cmd_start() threads it through to veridian-task.py create (--hold-for-owner-signoff);
  task.yaml now carries hold_for_owner_signoff; supervisor-entrypoint.sh''s merge-decision
  block checks it FIRST (before tier/verdict) and exits early with an Owner-notification
  instead of auto-merging.'
- 'Regression tests added: tests/veridian_task_branch_resolution_test.py, tests/hold_for_signoff_test.py
  -- `python3 -m pytest tests/ -k "branch_resolution or hold_for_signoff" -v` passes
  (7 tests). Full suite (18 tests) passes.'
- Verified existing shell regression tests (supervisor_merge_detection_test.sh, supervisor_audit_rerun_test.sh)
  and scripts/test_tight_task_validation.py still pass against the edited files.
- Confirmed canonical protocol file via scripts/check_single_protocol_file.py (ai-os/OWNER_DIRECTIVES/PROTOCOL_OWNER_AI.yaml)
  and added article A15_hold_for_owner_signoff documenting the enforced mechanism
  + PR563 incident.
- Checked for conflicts with parallel sibling tasks (task-20260726-082342 DDL pre-flight
  gate on task-gateway.py cmd_start(); task-20260726-083833 shell-profile write-gate)
  before committing.
remaining_steps: &id003
- Commit + push, open PR (or two, if a conflict with a sibling task's branch is likely
  -- to be noted in the PR body per CONSTRAINTS).
