completed_steps: &id002
- "Registered claim in `ai-os/boss/ACTIVE-CLAIMS.yaml` (no collision found \u2014\
  \ grepped for search-service/search-perf/V2-20/gin_trgm, none active)."
- "Re-verified the gap is still real: `search-service.ts`'s `searchAll()` uses plain\
  \ `ilike()` against `compliance_items.title/description`, `tasks.title/description`,\
  \ `clients.name`, org-scoped. No GIN/trgm index existed for any of these in git,\
  \ and (surprisingly) mostly not live either \u2014 see drift note below."
- Ran real `EXPLAIN (ANALYZE, BUFFERS)` against the live `verdian-ai` Supabase DB
  (project `pcrjmlpuqsbocqfwoxod`) at realistic org-scale volume (30k `compliance_items`
  / 50k `tasks` / 5k `clients` under real org `org_001`, vs. this DB's actual live
  counts of 178/1899/16), both before and after adding `pg_trgm` GIN indexes. Full
  plans and methodology in `ai-os/EXPLAIN_ANALYZE_SEARCH_PERF_2026-07-26.md`.
- "Wrote `drizzle/0264_search_perf_gin_trgm_indexes.sql` \u2014 adds the 4 missing\
  \ GIN trgm indexes (`compliance_items.description`, `tasks.title`, `tasks.description`,\
  \ `clients.name`) plus captures one pre-existing but **undocumented** live index\
  \ (`idx_ct2_ci_title_trgm` on `compliance_items.title`) under its existing name\
  \ so a fresh environment matches production. **Not applied live** \u2014 Tier2 (migration\
  \ + live DB) holds for Owner sign-off per this task's constraints."
- "No `search-service.ts` code change needed: `pg_trgm`'s opclass registers support\
  \ for the `ILIKE` (`~~*`) operator directly, so the existing `ilike()` calls become\
  \ index-eligible the moment the index exists \u2014 no query rewrite required."
- Committed the `ai-os/OS.yaml` index entry pointing at the EXPLAIN doc (was left
  uncommitted at the prior checkpoint).
- "Opened PR #582 (https://github.com/FChecklist/compliance-tracker/pull/582) \u2014\
  \ CI running at time of this update (Guardrail Presence Check, Documentation Sentinel\
  \ Check, Secret Scanning, Security Pattern Check already passing; rest pending)."
remaining_steps: &id003
- 'CI to finish on PR #582 and merge (no direct-to-main push per Rule 6).'
- "Owner sign-off + live `apply_migration` of `drizzle/0264_search_perf_gin_trgm_indexes.sql`\
