completed_steps: &id002
- Read governance docs (CONSTITUTION/AGENTS/ACTIVE-CLAIMS), the v2 plan's V2-2 spec,
  the design law (PLATFORM_STRATEGY.md:178/216), the kit's shell components (AppShellFrame/AppSidebar)
  + token class `.veri-nav-item`, and the app's AppShell/AppSidebar wiring.
- 'Registered ACTIVE-CLAIMS entry for V2-2-UNIFIED-NAV (app nav surface: AppShell.tsx
  + new BottomNavStrip.tsx), committed + pushed on its own. No collision with any
  other active entry.'
- "Decision recorded (also in the ACTIVE-CLAIMS entry): build `BottomNavStrip` in\
  \ compliance-tracker, reusing the kit's `NavItem` type + the `.veri-nav-item`/`.veri-nav-item.active`\
  \ token class the kit's globals.css already defines (no new token system). The kit's\
  \ own README scope boundary is \"product owns nav data; kit owns shared shell only\"\
  \ \u2014 a strip bound to product routes is product nav-data + thin horizontal layout,\
  \ not a multi-product shared primitive. Promote to kit only if a second FChecklist\
  \ product needs it (additive-when-justified)."
- "Built `src/components/BottomNavStrip.tsx` \u2014 horizontal nav strip reusing kit\
  \ `NavItem` type + `.veri-nav-item`/`.veri-nav-item.active` token class, route-aware\
  \ active state (mirrors the kit sidebar's `pathname === href || pathname.startsWith(href\
  \ + \"/\")` rule via `isBottomNavActive`), `overflow-x-auto` horizontal scroll on\
  \ narrow widths (scrolls, doesn't wrap \u2014 see file header for why wrapping is\
  \ avoided), `print:hidden`."
- "Extracted pure testable helpers into `src/components/bottom-nav-items.ts` (`BOTTOM_NAV_ITEMS`,\
  \ `isBottomNavActive`, `bottomNavLabelKey`) \u2014 same pattern as `src/lib/risk-classification.ts`\
  \ + its `.test.ts`, so the route\u2192item mapping and active-state matching are\
  \ unit-testable under `bun test`."
- "Wired `BottomNavStrip` into `AppShell.tsx` in BOTH branches \u2014 the `veriChatV2Enabled`\
  \ (kit `AppShellFrame`) branch (after `{children}`, inside the cream content wrapper)\
  \ AND the legacy branch (after `{children}`, inside `<main>`) \u2014 so it's live\
  \ across all `(app)` pages."
- Mapped the design-law's 6 items (Chat / To Do / Analytics / Approval / Email / New)
  to real routes, honestly reconciling the two that don't exist as routes yet (`/email`,
  `/new`).
- Added `Nav.bottomNav.*` i18n namespace to `messages/en.json` + `messages/hi.json`
  (both languages populated).
- "Wrote real tests for the bottom-nav logic (`bottom-nav-items.test.ts`, 9 tests\
  \ / 27 assertions, all passing) \u2014 see \"Test approach (honest)\" below."
- "Added `.no-scrollbar` utility to `src/app/globals.css` `@layer utilities` (the\
  \ strip's horizontal scrollbar is hidden so it doesn't clutter the shell's bottom\
  \ edge; the kit's own globals.css doesn't define this \u2014 the kit's sidebar is\
  \ vertical)."
- "Fixed a JSX bug found during verification: `toSharedItem` originally rendered `<icon\
  \ .../>` (lowercase) \u2014 JSX treats a lowercase tag as a DOM element, so the\
  \ lucide icons would silently not render. Replaced with a capitalized-destructure\
  \ `BottomNavIcon({ icon: Icon })` matching the app's own `SidebarIcon` pattern in\
  \ AppSidebar.tsx."
- '`tsc --noEmit` clean (exit 0). `eslint` clean on all changed/new files (exit 0).
  `bun test` clean (9 pass / 0 fail).'
remaining_steps: &id003
- "Open PR (Tier2 \u2014 AppShell = app-shell surface touched \u2192 holds for Owner\
