  diff (3 of 4 new service files + tests never shown to the reviewer).'
- 'Found the actual mechanics: `mandatory-audit-check.yml` calls `scripts/validate-audit-verdict.ts`,
  which takes the LAST `AUDIT: PASS/FAIL` comment in the whole PR thread with no commit-SHA/timestamp
