  (content blobs, no display-name column, same class as the already-exempted prompt_versions)
  in ai-os/registry/asset-registry-coverage.yaml; registered prompt_marketplace_listings
  (has a real admin-authored `title` column) via new drizzle/0270_register_prompt_marketplace_listings.sql
