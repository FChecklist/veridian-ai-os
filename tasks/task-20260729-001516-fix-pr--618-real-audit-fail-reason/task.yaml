  and fixed the audit''s other, in-scope finding: collapsed drizzle/0269''s self-correcting
  create-then-drop-then-recreate RLS/GRANT narrative into one clean `FOR ALL` block,
  plus a cross-test mock-leak fix in prompt-export-import-service.test.ts. Verified
  this fix is sound by direct read.'
- 'Ran `gh pr checks 618` and found 2 MORE real, currently-failing CI gates the audit
  comment never covered (mechanical coverage-gate checks, not the AI audit): Asset
  Registry Coverage Check (3 new tables -- prompt_translations, prompt_localizations,
  prompt_marketplace_listings -- had no registry decision) and Terminology Guardrail
  Check (16 new hardcoded_iso_date findings across 12 files, all legitimate dated
  gap-closure comments with no exemption-manifest entry yet).'
