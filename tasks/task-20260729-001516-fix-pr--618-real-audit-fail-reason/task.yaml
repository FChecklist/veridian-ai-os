  comment, not human example data. Verified locally: `node scripts/check-terminology-guardrail.mjs
  --diff-only` passes (18 files scanned, no new findings).'
- 'Ran full phase_8 test suite locally (`~/.bun/bin/bun test` on the 5 prompt-*-service.test.ts
  files together, confirming faa52ec0''s cross-test mock-leak fix still holds): 40/41
  pass; 1 flaky timeout in prompt-translation-service.test.ts ("rejects an unknown
  locale before touching the DB or an LLM", 5000ms timeout) under investigation --
  re-running in isolation to confirm whether it''s a real regression or a pre-existing
  flake unrelated to this task''s changes (this task touched no service/test code,
  only registry YAML + a new migration file).'
- 'Confirmed the 1 flaky test failure is NOT a real regression: re-ran the file in
  isolation and got a DIFFERENT, non-deterministic set of failures (2 fail + 1 unhandled
  error, 211s for 6 trivial tests) alongside independent evidence of severe sandbox
  resource contention (tsc --noEmit OOM''d at default Node heap size on the first
  attempt). This task''s diff touches zero TypeScript/service/test code (only registry
  YAML + one new, not-yet-applied-live SQL migration), so it cannot be the cause.'
- '`tsc --noEmit` (raised heap, `NODE_OPTIONS=--max-old-space-size=6144`): clean,
  exit 0, empty output.'
- 'Committed (9a80acf7) + pushed the fix directly to PR #618''s own branch (worker/task-20260728-051737-owner-engine-phase-8-real-gaps),
  working in that task''s own existing workspace/worktree rather than opening a second
