- "**Cost anomaly detection** (Medium): new `src/lib/services/cost-anomaly-service.ts`\
  \ \u2014 ratio-based recent-vs-baseline deviation check, per org (tenant, `scope='product_orchestra'`)\
  \ and per AI-Team role (`scope='ai_team_internal'`), sourced from the real `token_usage_ledger`.\
  \ Simple/explainable per the finding's own recommended approach: `recentSpend /\
  \ baselineAvgDaily >= 3x` (default), with a `$1` minimum-spend floor to avoid flagging\
  \ trivial noise, plus a distinct \"new spender\" case (real spend above the floor\
  \ with zero baseline). Pure `classifyAnomaly()` unit-tested (7 tests); DB wrapper\
  \ `detectCostAnomalies()` not unit-tested, matching this codebase's established\
  \ pure/DB-touching test split. New cron entry point `GET /api/internal/cost-anomalies/run`\
  \ (`CRON_SECRET`-gated, same pattern as every other `/api/internal/*/run` route)\
  \ + daily `vercel.json` cron line. No dashboard/inbox surface yet \u2014 honestly\
  \ disclosed scope limit, same posture as `ai-performance-report-service.ts` and\
  \ its sibling cadence reports."
- '**Forecasted vs actual monthly AI spend** (Medium): new shared pure module `src/lib/spend-forecast.ts`
  (linear run-rate projection: `spend-to-date / days-elapsed * days-in-month`), unit-tested
  (11 tests). Wired into two real, already-live surfaces rather than building a new
  dashboard:'
- "**Unused/idle AI capacity identified** (Low): new `src/lib/services/idle-ai-capacity-service.ts`.\
  \ `customerModelConfig` (org/Layer-2) and `clientModelConfig` (client/Layer-3) rows\
  \ with a real configured API key ARE this schema's \"provisioned AI capacity\" records,\
  \ and both already carry `lastUsedAt` for exactly this purpose (same field `orchestra-model-resolver.ts`'s\
  \ `borrowFromSharedPool()` already reads to compute idleness for a different, 5-minute-cutoff\
  \ question). Idle = unused (or never used since `createdAt`) for 90+ days (quarterly).\
  \ Pure `classifyIdleCapacity()` unit-tested (4 tests); DB wrapper `findIdleAiCapacity()`\
  \ not unit-tested. New cron entry point `GET /api/internal/idle-ai-capacity/run`\
  \ + quarterly `vercel.json` cron line (`0 10 1 1,4,7,10 *`). Per the finding's own\
  \ recommended approach (\"simple quarterly query, not worth dedicated tooling at\
  \ current scale\") \u2014 one deterministic query, no new table, no dashboard."
- "Verified: `bunx tsc --noEmit` clean; `bunx eslint` clean on every new/changed file;\
  \ full `bun test` \u2014 1443 pass / 0 fail (was already passing before this change;\
  \ no regressions)."
