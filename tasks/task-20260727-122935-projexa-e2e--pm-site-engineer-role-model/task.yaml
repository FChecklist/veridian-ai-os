- 'PROJEXA role model: extended `memberships.role` (drizzle/0012, applied live via
  Supabase MCP) to `owner | admin | pm | site_engineer | member | client_viewer` --
  `client_viewer` made a real PROJEXA-native role (justified in PR description: PROJEXA''s
  VERIDIAN calls use one shared per-org API key, not a per-user VERIDIAN identity,
  so there is nothing on the VERIDIAN side for a per-user client_viewer gate to attach
  to).'
