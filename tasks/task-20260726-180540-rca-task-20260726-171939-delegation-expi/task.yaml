- 'Established the original task actually SUCCEEDED (73 turns, PR #579 opened against
  compliance-tracker, 2042 tests green, `tsc` clean) -- this was never a real hang/loop
  in the AI''s own work.'
- 'Traced the false STALL flag to worker-entrypoint.sh: the periodic-checkpoint heartbeat
  background loop (`CHECKPOINT_PID`) was killed (`kill`/`wait`, old lines 242-244)
  immediately after the main `claude -p` invocation returned -- BEFORE the quality-gate
  loop (lint/build/test, up to 2 `claude -p --continue` auto-fix retries) that follows
  it, which has no wall-clock bound.'
- 'Confirmed live evidence: this task''s own quality-gate phase (`next build`, `bun
  run build`) ran with 4.3G memory peak / 522.9M swap for up to ~36 minutes wall-clock
  with almost no further CPU -- i.e. genuinely still working (memory-pressure-slow),
  not hung. With the heartbeat already dead, task.yaml''s last checkpoint stayed frozen
  at the pre-gate `"periodic checkpoint"` note the whole time.'
- Confirmed `veridian-task-watchdog.py`'s STALL check (`evaluate()`) fires purely
  on checkpoint age (>=20 min), independent of note content -- `LOOP_EXCLUDED_NOTES`
  only exempts `"periodic checkpoint"` from the *loop* check, not the *stall* check.
  So any task whose quality-gate phase legitimately runs >20 minutes gets misdiagnosed
  as stalled off a frozen `"periodic checkpoint"` note, triggering a wasted duplicate
  RCA task dispatch -- exactly what happened here (this very RCA task).
- '**Zero-duplication finding**: while investigating, found `task-20260726-175009-rca-task-20260726-171926-remove-anthropi`
  (a sibling RCA task, independently escalated for a *different* original task, `task-20260726-171926`,
  same `"periodic checkpoint"` signature) had already root-caused the identical bug
  and already applied the live fix to `/opt/veridian/scripts/worker-entrypoint.sh`
  (removed the early `kill/wait`, added a NOTE explaining the fix relies on the existing
  `trap ''kill $CHECKPOINT_PID'' EXIT` to reap the loop at real script exit instead).
  Verified the live fix directly (diff reconstructed against the pre-fix content read
  earlier in this session) -- it is correct, complete, and matches the fix this task
  would otherwise have made independently. Did NOT re-edit the live file (avoids clobbering
  a correct concurrent fix); instead documented the already-applied diff as `ai-os/patches/worker-entrypoint-checkpoint-heartbeat-quality-gate-fix-2026-07-26.diff`,
  per this repo''s established convention for untracked live scripts (see `ai-os/patches/worker-entrypoint-noop-pending-review-fix-2026-07-24.diff`
  for precedent).'
- Registered/reconfirmed `known_fixes` row for signature `"periodic checkpoint"` via
  `superboss-register.py log-fix` (fix_action `restart_unit`, matching the sibling
  RCA task's registration -- `restart_unit` is a real, whitelisted `FIX_ACTIONS` entry
  in `veridian-task-watchdog.py`, and safe here because `worker-entrypoint.sh`'s own
  resume path (`IS_RESUME`) means a watchdog-triggered restart resumes from the last
  real checkpoint rather than re-doing work).
