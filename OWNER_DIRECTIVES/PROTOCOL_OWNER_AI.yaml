superboss_protocol_addendum_2026-07-29b_hardconstraints:
  owner_supplied: true
  note: >-
    Owner directive 2026-07-29 (second same-day addendum): hard constraints on how ALL future
    work in this system is stored/organized. Real, disclosed conflict this addendum resolves:
    this same assistant had already created 5 new .md files earlier the same day
    (uncomplicate_unduplicate_task.md, two_engine_task.md, completion_of_pending_tasks.md,
    completion_of_projexa_ai_com.md, standing_execution_directive.md) before this directive was
    given. Real remediation already taken: all 5 migrated verbatim into the real, existing
    `instructions` table (superboss-register.py's real schema, not a new one) as real INS- rows
    (INS-20260729-050130-7a80/e18e/0111/e4f2/d4a6), verified non-truncated by real length check
    after insert, then the original files renamed (not deleted -- ai-os is not a git repo) to
    `<name>.md.superseded-by-<INS-id>` so the real content trail is preserved but the .md is no
    longer the canonical source. Known real side-effect, disclosed not hidden: 2 workflows
    already in flight at the time of this rename (wf_8147b869-297, wf_0e71258b-1fc) had these
    exact file paths baked into already-dispatched agent prompts -- any of their agents reading
    the old path will get a real file-not-found and should report it as a real blocker, not be
    silently patched around with a new stub file (that would itself violate this same addendum).
  hard_constraints:
    no_new_files: >-
      No new .py/.yaml/.md files anywhere under /opt/veridian/scripts or /opt/veridian/ai-os,
      going forward, for any of the currently-queued tasks (UNCOMPLICATE_UNDUPLICATE_TASK,
      TWO_ENGINE_TASK, COMPLETION_OF_PENDING_TASKS, COMPLETION_OF_PROJEXA_AI_COM, and the parallel
      architecture/search-design work). Use existing tables (the real `instructions` table via
      superboss-register.py log-instruction/log-work, `umr_tasks`, `system_index`,
      `wiring_registry`) instead. This document (PROTOCOL_OWNER_AI.yaml) remains the sole
      exception -- it is the one mechanically-enforced-singular file
      (check_single_protocol_file.py), edits to it are additions to existing infrastructure, not
      new files.
    no_new_metadata_schemes: "Reuse the real, existing UTM-shaped fields already in the
      `instructions` table (utm_source/medium/campaign/content/term + metadata_json) and
      `umr_tasks`'s existing inputs_json/metadata pattern. Do not invent a new tagging convention."
    no_new_engines: "Reuse the real, existing engines (gateway.py/OWNER_ENGINE,
      resource_governor.py, directive_engine.py, superboss-register.py, the real AI Dev Team
      dispatch system in compliance-tracker) as the substrate for END_USER_ENGINE and the
      unified-search capability -- do not stand up parallel new engines for these, per the same
      zero-duplication lesson that already had to be applied once to dispatch_core.py vs
      resource_governor.py."
    machine_readable_over_prose: >-
      Server-side artifacts (script docstrings/comments excepted -- those remain real code
      documentation) should prefer structured data (existing YAML/JSON/DB fields) over new
      freeform prose documents. This does not retroactively purge English prose from existing
      structured fields (e.g. this document's own `rule:`/`note:` fields, or MEMORY_OWNER_AI.yaml)
      -- those are the established, working, real pattern and are not being changed. Communication
      TO the Owner remains simple English, per this document's existing communication_channels
      article -- that is unchanged and not in conflict with this constraint.
    two_gates_model: >-
      Exactly two real entry points for real actors into this system: OWNER_ENGINE
      (gateway.py, real, live) for the Owner, and END_USER_ENGINE (not yet built -- real design
      work is TWO_ENGINE_TASK's scope) for end users. superboss-register.py's `instructions`/
      `umr_tasks` tables are the shared BACKEND both gates write into, not a third gate --
      no real actor interacts with them directly, only through one of the two engines.
    single_id_generation_points: >-
      Chat ID: gateway.py's own TaskGateway.id_gen.generate_id() (VD-<timestamp>-<sequence>) is
      the one real, existing, canonical source -- confirmed live 2026-07-29. Task ID:
      veridian-task.py's real `task_id = f"task-{ts}-{slug}"` construction (cmd_create) is the
      one real, existing, canonical source. END_USER_ENGINE must call these SAME real functions
      for end-user chats/tasks, not build parallel generators -- this is a real, testable
      requirement for TWO_ENGINE_TASK, not aspirational.
    search_engine_clarification: >-
      "search_engine," as used in this same-day Owner directive, refers to the real, EXISTING
      combination of the `instructions` table (searchable via superboss-register.py's real
      `search`/`check-duplicate` subcommands) and `system_index`/`wiring_registry` -- not a new
      component to be built. The real, disclosed gap (already documented in this same file's
      2026-07-28 addendum and in SYSTEM_MEMORY_ARCHITECTURE.yaml's layer_7) is that this existing
      substrate does not yet reach GitHub/Vercel/Supabase/browser state -- closing that gap is
      real design work already in progress (the SearchDesign phase of wf_283af08f-642), and it
      must extend this existing substrate, not create a parallel one.
  verified_2026-07-29: "Migration of the 5 pre-existing .md files completed and independently
    verified (real row lengths checked post-insert, no truncation) before this addendum was
    written -- not claimed without evidence."
