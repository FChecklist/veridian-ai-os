superboss_protocol_addendum_2026-07-29b_gapfix:
  purpose: "Final gap-fix pass over round-2 review findings. Every claim below was
    independently re-verified live on VERIDIAN-DEV before being fixed or flagged --
    round-2 reports were treated as leads, not ground truth (two of them directly
    contradicted each other about PHASE-2-CROSSREF's real status; both turned out
    incomplete on direct systemctl/task.yaml inspection, see owner_status_db_desync
    below)."
  fixes_applied:
    chat_id_crossref_gap:
      problem: "task-gateway.py's cmd_submit only attached owner_engine_chat_id
        metadata to the log-instruction row when --source owner. gateway.py's
        dispatch_to_task_lifecycle() always calls submit with --source ai_agent
        (by design, to avoid double-gating), so the instructions-table row for
        every owner-dispatch submission had metadata_json='{}' -- the chat_id was
        only recoverable informally as a raw-text substring, not a structured
        field, despite in-code comments claiming the cross-reference pattern was
        reused verbatim."
      fix: "Added optional --owner-chat-id to task-gateway.py's submit subcommand
        (dest=owner_chat_id, default None); cmd_submit now attaches
        {\"owner_engine_chat_id\": owner_chat_id} metadata for that path too.
        gateway.py's two submit-cmd call sites (submit and start actions) now pass
        --owner-chat-id <chat_id>."
      verified_at: "task-gateway.py:232-246,262-271,847-850 (cmd_submit +
        argparse); prompt_gateway/gateway.py:275-280,290-296 (call sites). Live
        smoke test 2026-07-29 00:06:49 UTC: task-gateway.py submit --source
        ai_agent --owner-chat-id VD-TESTVERIFY-99999999-0001 produced instruction
        INS-20260729-000649-db82 with metadata_json=
        '{\"owner_engine_chat_id\": \"VD-TESTVERIFY-99999999-0001\"}' -- confirmed
        via the CLI's own prior_search_results echo."
      backup: "task-gateway.py.pre-gapfixpass-backup-2026-07-29,
        prompt_gateway/gateway.py.pre-gapfixpass-backup-2026-07-29"
    emergency_stop_logging_ambiguity:
      problem: "_write_emergency_stop() and _shed_load() logged ATTENTION.md
        messages like 'CRITICAL: sustained metric overload {state}' where state
        is _record_emergency_tick's per-metric CONSECUTIVE-TICK COUNTER
        (0..6), not the real metric percentages -- e.g. 'disk_io: 6' meant
        '6 consecutive over-threshold ticks', not '6%'. This ambiguity caused
        multiple independent round-2 review passes to reasonably suspect a false
        trip on the standing 2026-07-28T17:58:14Z emergency stop, when in fact no
        review pass could tell either way from the log alone."
      fix: "dispatch_one() now passes its real sample_metrics() dict through
        _record_emergency_tick() to _write_emergency_stop()/_shed_load(), which
        append it to the ATTENTION.md message and (for the stop file) to the
        saved JSON, alongside the existing tick-counter for backward
        compatibility. No other script reads EMERGENCY_STOP_PATH/
        EMERGENCY_STATE_PATH's contents (confirmed via repo-wide grep), so this
        is additive/non-breaking. NOTE: this only affects future trips -- the
        currently-standing EMERGENCY_STOP file (set 2026-07-28T17:58:14Z, before
        this fix) still has count-only state and was not backfilled (no reliable
        source for the real historical percentages at that exact tick)."
      verified_at: "resource_governor.py:599 (call site), 860-935 (_shed_load,
        _write_emergency_stop, _record_emergency_tick). Live 2026-07-29 --tick
        run confirmed no regression (returned emergency_stopped cleanly)."
      backup: "resource_governor.py.pre-gapfixpass-backup-2026-07-29"
    stale_verified_at_citations: "The 4 wrong verified_at line citations in
      superboss_protocol_addendum_2026-07-29 (stage_2/3/4 and
      task_gateway_cmd_start_status) were corrected in place above, after
      independently re-deriving the real current line numbers -- see the
      CORRECTED notes inline in that section. Root cause: those citations were
      not re-checked after later edits shifted line numbers in the same files;
      this gap-fix pass's own line numbers may drift the same way after any
      future edit to these files and should be spot-checked, not assumed
      permanent."
  findings_flagged_not_fixed_owner_decision_required:
    owner_status_db_desync: "Direct systemctl --user show + task.yaml inspection
      (not owner_status.py's DB-only default view) on 2026-07-29 found BOTH
      PR610-CONFLICT (umr_id UMR-20260728-123527-5cb0, DB status 'running') and
