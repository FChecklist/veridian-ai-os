# ----------------------------------------------------------------------
# PLAN-09: PTTU token-accounting engine
# ----------------------------------------------------------------------
tasks:
  - id: PLAN-09
    title: "PTTU (Per-Task Token Used) calculation + ledger engine"
    real_schema_verified: >-
      compliance.token_usage_ledger (src/lib/db/schema.ts:8892-8915):
      id, scope ('ai_team_internal'|'product_orchestra'), orgId, userId,
      roleKey, layerKey, taskSummary, provider, model, promptTokens,
      completionTokens, estimatedCostUsd, cacheSavingsUsd, createdAt.
      NO taskType / codeReference / PTTU column exists yet -- confirmed
      by reading the full CREATE TABLE definition, not inferred.
    real_population_state_verified_live: >-
      Ran `select count(*) from compliance.token_usage_ledger` against
      the real Supabase project "verdian-ai" (pcrjmlpuqsbocqfwoxod):
      result = 0 rows, TOTAL, across BOTH scopes. This is a stronger
      finding than the prior session's "cacheSavingsUsd column ...
      unpopulated" note -- the entire table is empty, not just one
      column. Only 3 real call sites of logTokenUsage() exist in the
      whole codebase:
        1. src/app/api/ai/team/log-usage/route.ts (secret-gated,
           called by scripts/ai-workforce-agent.mjs in GitHub Actions --
           scope=ai_team_internal)
        2. src/lib/ai-team/team-service.ts:88 (AI Dev Team roster calls
           -- scope=ai_team_internal)
        3. src/lib/prompt-cache/metrics.ts:52 (THE ONLY
           scope='product_orchestra' call site that exists today --
           fires on every cache-eligible customer-facing LLM call, but
           only carries orgId/userId/layerKey/provider/model/usage --
           NO per-task-type field, NO codeReference)
      Conclusion: there is currently ZERO historical data of any kind
      to mine a per-task-type median from. Any PTTU formula must include
      a bootstrap/seeding period, not assume mineable history exists.
    concrete_formula_proposal: >-
      PTTU = tentative_ai_only_cost + (actual_ai_tokens_used * 1.2)
      [Owner's stated formula, unchanged -- the multiplier and even the
      formula shape are explicitly Owner-sign-off items per the existing
      plan, NOT decided here].
      This proposal only concretizes the genuinely-missing half,
      "tentative_ai_only_cost":
        1. TAXONOMY (free, exists today): use dispatchTool()'s
           `codeReference` string (task-execution-engine.ts) as the
           taskType key. It is already a real, granular, per-module
           identifier (get_compliance_stats, create_lead, ...) -- do NOT
           invent a new taxonomy.
        2. INSTRUMENTATION (small, concrete change): add ONE call to
           logTokenUsage() inside dispatchTool() itself (or its two real
           callers at task-execution-engine.ts:1738 and :2453), scope=
           'product_orchestra', with a new `taskType` column =
           codeReference. This is the single instrumentation point --
           not "instrument every module separately."
        3. SCHEMA CHANGE (concrete, one migration):
           ALTER TABLE compliance.token_usage_ledger
             ADD COLUMN task_type text,
             ADD COLUMN pttu_ai_only_estimate_usd numeric,
             ADD COLUMN pttu_actual_cost_usd numeric,
             ADD COLUMN pttu_total_usd numeric;
           (drizzle-kit generate + drizzle-kit migrate, standard existing
           workflow -- db:generate/db:migrate scripts already in
           package.json).
        4. BOOTSTRAP (concrete, addresses the 0-rows-today problem):
           for the first N=30 (configurable) real logged rows per
           taskType, tentative_ai_only_cost falls back to a static
           RATE CARD keyed on (taskType category, model tier) --
           e.g. simple-lookup tasks (get_*/list_*) = X tokens-equivalent,
           write/create tasks = Y, multi-step orchestration = Z -- three
           tiers, not per-task-type guesses, seeded from the ALREADY-
           EXISTING model-tier-eligibility.ts tiering the rest of the
           app uses (do not invent a fourth tiering scheme). Once
           real logged rows per taskType pass the N=30 threshold,
           SWITCH AUTOMATICALLY to
           `select percentile_cont(0.5) within group (order by
           prompt_tokens+completion_tokens) from token_usage_ledger
           where task_type = $1 and scope='product_orchestra'` --
           a real historical median, computed by a script/cron
           (reuse the existing vercel.json crons pattern, e.g. add
           /api/internal/pttu-median-refresh/run), not a manual number.
        5. ACCESS CONTROL (concrete mechanism, not "needs design"):
           the formula/breakdown columns (task_type,
           pttu_ai_only_estimate_usd, pttu_actual_cost_usd) live in
           `compliance` schema already governed by the same
           withTenantContext / org-scoped RLS posture cost-guard.ts uses
           for 'product_orchestra' rows today (cost-guard.ts:43) --
           extend the SAME Postgres RLS policy, do not design a new
           access-control mechanism. Only `pttu_total_usd` (the single
           customer-visible number) should ever be selected by any
           customer-facing API route; the breakdown columns should be
           selected ONLY by Finance-role-gated internal routes, mirroring
           the existing ai_team_internal vs product_orchestra scope
           split cost-guard.ts already enforces.
    owner_signoff_still_required: >-
      Unchanged from the existing plan: the exact multiplier (1.2), the
      exact rate-card tier boundaries in step 4, and whether PTTU should
      be shown per-task or only aggregated are all Owner calls. What
      changed here is that steps 1-5 above are now concrete enough to
      execute the day sign-off happens, instead of "this needs a
      formula."
    depends_on_this_pass: ["PLAN-02 (see dependency_edges above -- narrowed to dispatchTool's codeReference, not the full module audit)"]
    effort: large -- still the highest business-sensitivity item in this
      plan (pricing-facing); Owner sign-off gate unchanged.

