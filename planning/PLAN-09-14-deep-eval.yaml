    stated_as: "need real task-execution instrumentation points across modules first"
    concrete_mechanism: >-
      PLAN-02's own known_state names the real choke point already:
      src/lib/task-execution-engine.ts's dispatchTool(db, orgId, userId,
      codeReference, context?) -- a single function, called from every
      module (verified real call sites at task-execution-engine.ts:1738
      and :2453, plus CRM's create_lead/create_opportunity path PLAN-02
      already confirmed). `codeReference` is a real, already-populated,
      per-task-type string key (e.g. "get_compliance_stats",
      "get_overdue_items", "list_departments", "create_lead") threaded
      through EVERY module today, not a new concept to invent. PLAN-09
      does NOT need to wait for all of PLAN-02's module-by-module audit
      to complete -- it only needs dispatchTool()'s existing
      `codeReference` argument to become the taskType dimension logged
      into token_usage_ledger. This is a single wrapper change (call
      logTokenUsage alongside dispatchTool, scope='product_orchestra',
      new taskType column = codeReference), not a dependency on PLAN-02
      finishing.

  - edge: "PLAN-10 -> PLAN-01"
    stated_as: "shared UI/UX layer needed first"
    concrete_mechanism: >-
      PLAN-01's concrete deliverable is @fchecklist/veridian-ui-kit
      becoming a real built-out npm workspace package (it is ALREADY a
      real dependency today: package.json dependencies
      "@fchecklist/veridian-ui-kit":
      "github:FChecklist/veridian-ui-kit#v0.2.2" -- currently a
      near-skeleton per PLAN-01's own finding). Concrete mechanism: any
      new chart/table/diagram wrapper component built for PLAN-10/11
      (see scaffolding design below) should be authored INSIDE
      veridian-ui-kit and consumed by compliance-tracker via that
      existing github: dependency, not built as one-off components
      inside compliance-tracker's own src/components/. This makes the
      dependency mechanical and checkable: `grep veridian-ui-kit
      compliance-tracker/package.json` before/after, and a version bump
      in that one line is the actual signal PLAN-01 shipped something
      PLAN-10 can consume.

  - edge: "PLAN-10 -> PLAN-03"
    stated_as: "(PLAN-03 not in this agent's scope -- title/content not read; cross-referenced by id only per Owner's original numbering, not touched)"
    concrete_mechanism: >-
      Out of scope for this pass (PLAN-03 belongs to a different agent).
      Flagging only that PLAN-10's build sequence below does not assume
      PLAN-03 is done -- the AG Grid pilot (see PLAN-10/11 section) has
