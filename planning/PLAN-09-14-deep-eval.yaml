  - edge: "PLAN-11 -> PLAN-10"
    stated_as: "same library stack, Owner said merge"
    concrete_mechanism: >-
      Literal merge mechanism: PLAN-11's "8 interaction modes" (Explain/
      Analyze/Predict/Recommend/Audit/Summarize/Decision-support/Reports)
