  - id: "PLAN-10+11 (merged per Owner instruction)"
    title: "VERIDIAN Visualization + Presentation Engine"
    recommended_single_pilot:
      library: "AG Grid Community (ag-grid-community + ag-grid-react)"
      screen: "src/app/(app)/reports/page.tsx (+ src/components/ui/data-table.tsx)"
      why_this_and_not_echarts: >-
        The task brief asked to weigh "extend an existing surface" vs.
        "attach to nothing." Evidence: recharts (already present, ^3.9.2)
        already renders charts in 7 real files (orchestra/analytics,
        reports, compliance-chart.tsx, chart.tsx, DashboardAnalytics.tsx,
        CustomChartBuilder.tsx, CustomReportsSection.tsx) -- the
        "charting" need is NOT a blank slate the way the plan's own
        placeholder guess assumed. ECharts' genuine NEW capability
        (heatmap/risk-matrix/knowledge-graph/org-map) has ZERO existing
        component to extend either (confirmed: no heatmap/risk-matrix
        component exists anywhere in src today) -- so ECharts is
        actually closer to "net-new" than "extend existing," contrary to
        the plan's guess.
        AG Grid, by contrast, has a real, narrow, already-working
        extension point: @tanstack/react-table (^8.21.3) +
        data-table.tsx, used in exactly ONE screen today
        (reports/page.tsx). Reports is also the single most
        cross-cutting of the 17 named visualization types -- grep found
        15+ distinct /api/**/reports and /api/**/dashboard routes across
        GRC, finance, construction, ERP, internal, and orchestra domains,
        all of which are plausible future consumers of the same grid
        component once it exists. A data-grid (sort/filter/group/
        virtualize/export) is also a more broadly reusable primitive
        than a single-purpose chart type -- nearly every one of the
        other 16 visualization types eventually needs SOME tabular view
        (audit explorer, document explorer, KPI dashboards all have
        table-shaped sub-views).
        Recommend ECharts as PILOT #2 immediately after, specifically
        targeted at compliance-heatmap/risk-matrix (genuinely net-new,
        no existing component to reconcile against).
    automation_scaffolding_design: >-
      Per Owner's explicit "100% automation, no manual work, no
      individual implementation table by table" instruction: do NOT plan
      to hand-wire AG Grid (or any of the 11 libraries) into N screens
      one at a time. Concrete generator design:
        1. Define ONE schema file per screen (not per library):
           `src/lib/viz-registry/screens/<screen-id>.viz.ts`, exporting
           a typed `ScreenVizDefinition` = { screenId, dataShape (column
           defs + types, reusing the Drizzle table's own inferred types
           via `typeof someTable.$inferSelect` -- NOT hand-typed a
           second time), vizType: 'grid'|'chart'|'diagram'|'gantt'|'map'
           |'pdf', aiModes?: ('explain'|'audit'|'summarize'|...)[] }.
        2. Build ONE codegen script,
           `scripts/generate-viz-component.mjs <screen-id>`, that reads
           the screen's .viz.ts definition and EMITS the actual React
           wrapper component (e.g.
           `src/components/viz/generated/<screen-id>.tsx`) importing the
           correct library (ag-grid-react for vizType='grid', echarts
           for 'chart', etc.) with columns/series auto-derived from
           dataShape. This script lives in veridian-ui-kit (per the
           PLAN-01 dependency edge above) so it is reusable by
           compliance-tracker, projexa, and any future brand.
        3. Rollout to N screens becomes:
           `for f in src/lib/viz-registry/screens/*.viz.ts; do node
           scripts/generate-viz-component.mjs "$(basename "$f"
           .viz.ts)"; done` -- one script run, not N manual
