      (DemoVeridian2026!). One of the fictitious Wave-111 companies is
      literally named "Skyline Construction Co" (demo_co_8_skyline, 50 CRM
      leads seeded) but has ZERO rows in every construction table despite
      the construction-sounding name -- a real name/data mismatch, separate
      from the org-routing bug.
      No committed, re-runnable seed script exists for demo_org itself --
      src/db/seed.ts seeds an unrelated "Acme Corp" org. The real 2026-07-06
      seeding was one-off SQL applied live via Supabase MCP, documented only
      as prose comments inside drizzle/0185_sales_branch_enablement_backfill.sql
      and drizzle/0201_projexa_demo_org_erp_sales_hr_enablement.sql
      (both explicitly self-described as "a reviewable RECORD of a
      data-only change already applied live... not itself run by the
      migration runner").
    automation_mechanism:
      script_1:
        path: ai-os/scripts/demo-data/check-demo-coverage.mjs
        purpose: >-
          Idempotent, re-runnable coverage checker: queries live row counts
          for org_id='demo_org' across every table in the manifest below,
          flags any at zero. Meant to be run BEFORE and AFTER seeding
          (regression gate), and re-runnable forever afterward (e.g. wired
          into a periodic check) rather than a one-off manual audit.
        exact_command: "node ai-os/scripts/demo-data/check-demo-coverage.mjs --org demo_org"
        manifest_input: >-
          ai-os/scripts/demo-data/demo-coverage-manifest.yaml -- one entry
          per table (the full list above), used by both this script and
          script_2 so the "what needs seeding" list is defined once, not
          duplicated between a checker and a seeder.
      script_2:
        path: ai-os/scripts/demo-data/seed-demo-org-full-coverage.mjs
        purpose: >-
          ONE script, manifest-driven from demo-coverage-manifest.yaml, that
          inserts realistic rows into EVERY zero-coverage table for
          org_id='demo_org' in one run. Idempotent: checks existing count
          per table before inserting (skips tables already non-zero, so
          re-running it is always safe). Realistic row generation uses the
          SAME shape/values already proven to exist in projexa_demo_org
          (queried live and used as a template for realistic construction
          data, rather than inventing fake shapes) -- effectively
          re-pointing/cloning projexa_demo_org's already-good construction
          data into demo_org's identity, then adding CRM-depth rows
          (crm_accounts, crm_contacts, crm_stage_history) fresh since those
          are empty everywhere.
        exact_command: "node ai-os/scripts/demo-data/seed-demo-org-full-coverage.mjs --manifest ai-os/scripts/demo-data/demo-coverage-manifest.yaml --org demo_org --template-org projexa_demo_org --apply"
      script_3:
        path: ai-os/scripts/demo-data/e2e-3x-runner.mjs
        purpose: >-
          Automates the "run it end-to-end 3 times" requirement itself
          rather than a human clicking through the app 3 times: drives
          Playwright (check package.json for existing e2e test infra first
          -- if present, reuse it rather than adding a new framework) through
          one scripted pass per module/persona login, capturing errors,
          re-running automatically up to 3 times, diffing what broke between
          passes. Each pass's failures get logged to a single running
          findings file rather than 3 separate manual QA notes.
        precondition_verification_step: >-
          Run `grep -n '"playwright"\|"cypress"' package.json` first to
          confirm which e2e framework (if any) already exists in
          compliance-tracker before deciding whether script_3 wraps existing
          infra or needs a minimal net-new one -- NOT verified in this
          deep-dive, flag as open.
    step_by_step_plan:
      - "1. Run script_1 (check-demo-coverage.mjs) once to get a fresh baseline (should reproduce the zero-table list above)."
      - "2. Fix the org-identity bug first: decide (Owner call, small decision) whether to (a) re-point the 10 demo-persona logins at projexa_demo_org instead of demo_org, or (b) seed demo_org directly by cloning projexa_demo_org's data. Recommend (b) since the persona logins/passwords are the documented, memorized artifact Owner-facing demos rely on -- don't change what a login points to, fix what data is under it."
      - "3. Run script_2 (seed-demo-org-full-coverage.mjs --apply) with --template-org projexa_demo_org."
      - "4. Re-run script_1 to confirm zero remaining zero-coverage tables."
      - "5. Separately fix the crm_accounts/crm_contacts global-zero gap (affects every org, not just demo_org) -- this is a PLAN-02-adjacent finding (these tables were added to the schema in the same wave as crm_stage_history but never wired into any seed OR write path anywhere) -- flag to whoever owns PLAN-02's CRM wiring, since these tables' write path is presumably part of the same createLead/createOpportunity-adjacent CRM completion work."
      - "6. Confirm e2e framework choice (precondition_verification_step above), then run script_3 up to 3 times, fixing breakage found each pass, before declaring PLAN-05 done."
    effort_reestimate: "Data-seeding portion (steps 1-5) is small-to-medium once template-org-cloning approach is used instead of manual row-by-row seeding. The 3x E2E run (step 6) genuinely depends on PLAN-02's module wiring being done for whichever modules are being driven through the chat/pill/chain path specifically (see dependency_table)."

  # ------------------------------------------------------------------------
  - id: PLAN-06
    title: "3-round audit process, turned into a reusable checklist artifact -- DEEP-DIVE REPLACEMENT"
    verified_current_state: >-
      This item needed no new investigation (per scope) -- it needed the
      existing, already-proven 3-round-audit convention (used for the
      2026-07-18 credit-governance work) turned into a literal, reusable
      artifact. That convention, reconstructed from this session's own
      established practice and the plan's own meta.guardrails_applied note
      ("verification.self_certification is forbidden per
      STANDING_DIRECTIVE.yaml"), is: Round 1 = fresh-eyes audit against the
      ORIGINAL objective (not the implementer's own summary of what they
      did), listing every gap found, however small. Fix. Round 2 = re-audit
      ONLY what changed from Round 1's fixes, PLUS a spot-check that nothing
      else regressed. Fix. Round 3 = final, zero-tolerance audit, explicit
      sign-off. Round 4 (meta) = audit the audit PROCESS itself -- were
      rounds 1-3 run with genuine independence (e.g., a different
      agent/context per round, not the same agent grading its own prior
      round), not just three passes by the same biased reviewer.
    automation_mechanism: >-
      The literal reusable artifact is the checklist file below. Where
      automatable, each round's checks reference a script rather than a
      human eyeballing a screen (e.g. Round 1's "does this module's
      dispatch actually write to the DB" check runs
      smoke-test-new-actions.mjs from PLAN-02, not a manual click).
    reusable_artifact:
      path: ai-os/templates/3-ROUND-AUDIT-CHECKLIST.yaml
      exact_schema: |
        audit_subject: <task id being audited, e.g. PLAN-02>
        source_of_truth: <link to the ORIGINAL objective/spec, not the implementer's summary>
        round_1_fresh_eyes:
          reviewer: <must be a different agent/session than the implementer>
          checks:
            - "Every claim in the implementer's completion report has a corresponding automated-script output or live-query result attached (no bare prose claims accepted)"
            - "Every new codeReference/action has a passing smoke-test-new-actions.mjs (or module-equivalent) result, not just 'looks right in the code'"
            - "tsc --noEmit and the full existing test suite both pass, re-run fresh by the reviewer, not trusted from the implementer's last run"
          output: list of gaps found, however small, with file:line evidence per gap
          gate: "if any gap found -> fix -> do not proceed to round_2 until fixes are re-verified by the SAME round_1 checks"
        round_2_delta_plus_regression_spot_check:
          reviewer: <may be same or different from round_1, but must independently re-run checks, not just re-read round_1's notes>
          checks:
            - "every round_1 gap is now closed, with fresh evidence (not the implementer's say-so)"
            - "spot-check 2-3 adjacent areas NOT touched by the fix, to catch regressions"
          output: list of any remaining/new gaps
          gate: "same as round_1 -- fix, re-verify, do not proceed until clean"
        round_3_final_zero_tolerance:
          reviewer: <ideally the most senior/independent reviewer available>
          checks:
            - "full re-run of every automated check from round_1 and round_2"
            - "explicit written sign-off statement, naming the reviewer and timestamp"
          output: "PASS or FAIL, with the same file:line evidence standard as round_1 -- no 'looks good to me' without attached evidence"
          gate: "FAIL -> back to round_1 for the failing item specifically, not a full restart of everything"
        round_4_meta_audit_of_the_process:
          checks:
            - "were round_1/2/3 reviewers actually independent of the implementer and of each other, or was this 3 passes by the same person/context self-grading?"
            - "does every gap/fix/sign-off in rounds 1-3 have a corresponding ai-os/boss/COMPLETED.yaml entry, so the audit trail is machine-checkable later, not just this session's memory?"
          output: "confirms or denies the process itself met STANDING_DIRECTIVE.yaml's no-self-certification rule"
    step_by_step_plan:
      - "1. Write ai-os/templates/3-ROUND-AUDIT-CHECKLIST.yaml with the exact schema above (this is the literal deliverable this task asked for)."
      - "2. For each of PLAN-01..05, once its COMPLETED.yaml entry exists (per the dependency_table's PLAN-01..05 -> PLAN-06 mechanism), instantiate one copy of the checklist with audit_subject set to that plan id, and run rounds 1-4 against it."
      - "3. Each round's reviewer must be a genuinely separate agent/session invocation, not the same context re-reading its own prior output -- this is the one non-negotiable, evidence-backed requirement from this session's own precedent (self_certification forbidden per STANDING_DIRECTIVE.yaml)."
      - "4. Store each completed round's checklist instance under ai-os/boss/audits/<PLAN-ID>-round-<N>.yaml so the trail is queryable later, not just narrated in chat."
    effort_reestimate: "small -- the artifact itself is a template (already fully specified above); the actual per-round audit work is proportional to whatever PLAN-01..05 produced, done 5 separate times (once per plan item), not once."
