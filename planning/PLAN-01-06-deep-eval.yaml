    automation_mechanism:
      script_1:
        path: ai-os/scripts/ui-kit-sync/detect-kit-drift.mjs
        purpose: >-
          Reads @fchecklist/veridian-ui-kit's actual exported TypeScript
          interfaces (via the `typescript` package's Compiler API, already a
          devDependency in both consuming repos -- no new dependency needed)
          from the version currently on disk in node_modules, diffs them
          against the interfaces consumed by compliance-tracker's and
          projexa's local product-layer files (AppShell.tsx, AppSidebar.tsx,
          AppTopbar.tsx, VeriChatPanel.tsx, HomeThreadSlot.tsx,
          veri-chat-context.tsx). Emits a machine-readable JSON report of any
          prop/type mismatch BEFORE a version bump, so nothing is manually
          eyeballed screen-by-screen.
        exact_command: "node ai-os/scripts/ui-kit-sync/detect-kit-drift.mjs --repo compliance-tracker --against-version v0.3.0"
        run_again_for: "node ai-os/scripts/ui-kit-sync/detect-kit-drift.mjs --repo projexa --against-version v0.3.0"
      script_2:
        path: ai-os/scripts/ui-kit-sync/bump-and-verify.sh
        purpose: >-
          One script, run once per consuming repo, that (a) edits
          package.json's veridian-ui-kit dependency line from #v0.2.2 to
          #v0.3.0 (sed/jq, not manual edit), (b) reinstalls
          (bun install / npm install depending on repo's lockfile), (c) runs
          `tsc --noEmit`, (d) runs the repo's existing test suite filtered to
          veri-chat/composer-related test files (ChainSelector.test.ts
          confirmed to exist in compliance-tracker), (e) exits non-zero on
          any failure so it cannot be silently treated as done.
        exact_command: "bash ai-os/scripts/ui-kit-sync/bump-and-verify.sh compliance-tracker v0.3.0"
      script_3:
        path: ai-os/scripts/ui-kit-sync/find-duplicate-composer-usage.mjs
        purpose: >-
          Answers the still-open "Wave 8: is PROJEXA's local VeriComposer
          live or dead code" question mechanically instead of manual code
          reading: greps every .tsx file in /opt/veridian/repos/projexa/src
          for actual JSX usage (`<VeriComposer`, `<ChainSelector`,
          `<VeriChatPanel`) of the LOCAL import path vs the kit's, cross-
          references against the Next.js route manifest
          (.next/server/app-paths-manifest.json after a build) to confirm
          which routes actually render it in production, not just import it.
        exact_command: "node ai-os/scripts/ui-kit-sync/find-duplicate-composer-usage.mjs --repo projexa"
    step_by_step_plan:
      - "1. Run script_1 (detect-kit-drift.mjs) against both repos at v0.3.0. If it exits non-zero (breaking interface changes found), STOP and read the JSON diff report before proceeding -- do not bump blind."
      - "2. If script_1 is clean, run script_2 (bump-and-verify.sh) for compliance-tracker, then for projexa. Each run is a single self-contained pass; do not hand-edit package.json."
      - "3. Run script_3 (find-duplicate-composer-usage.mjs) against projexa to get a definitive live/dead verdict on its local composer. If LIVE: file this as its own small follow-up wave (retire it, re-point to the kit's composer + projexa's own veri-chat-context, same pattern compliance-tracker already completed 2026-07-19 per its own code comments) -- do not fold that retirement into this same pass, since it touches a live user-facing surface (per this session's own risk-sequencing convention: UX-surface changes get their own scoped wave, not a bundled one). If DEAD: delete the dead files in the same PR as the version bump, no separate wave needed."
      - "4. Tag a new veridian-ui-kit release only if step 1-3 required any fix commits to the kit itself; otherwise v0.3.0 is already the target, no new tag needed."
      - "5. Verification: `bunx tsc --noEmit` clean in both consuming repos AND the kit repo itself; existing ChainSelector.test.ts passes; script_3's live/dead verdict is recorded in ai-os/boss/COMPLETED.yaml, not left as an open question."
    effort_reestimate: "small-to-medium (version bump + one drift script + one live/dead determination), not large -- the large 'build the kit from scratch' framing in the original plan is superseded by verified reality."

