      React Flow, Mermaid, Frappe Gantt, @hello-pangea/dnd, AG Grid,
      MapLibre, React PDF Viewer) are present.
      CRITICAL FINDING FOR SCOPE: since 100% of the live report_definitions
      catalog's output_formats vocabulary is table/chart, and recharts +
      jspdf/jspdf-autotable ALREADY cover both of those formats today,
      **zero new library dependencies are required to close this specific
      gap** -- PLAN-03 does not need to wait on or overlap with PLAN-10's
      11-library visualization engine at all. This corrects the original
      plan's implicit assumption that PLAN-03 needs new OSS sourcing.
    automation_mechanism:
      design_rationale: >-
        Owner directive: no per-report manual page-building for 200 rows.
        One generic, metadata-driven renderer replaces "build 200 pages."
      script_or_component_1:
        path: "src/app/(app)/reports/catalog/[reportId]/page.tsx"
        purpose: >-
          ONE dynamic route. At request time: fetches the report_definitions
          row by id, branches purely on its `status` and `outputFormats`
          fields (not per-row custom code): status=built + outputFormats
          includes "table" -> renders via a shared <ReportTableView> reading
          from the `executionConfig`-referenced data source; +chart ->
          additionally renders a <recharts> chart component parameterized by
          `executionConfig`; status=data_gap -> renders a real, honest
          "data not available yet -- <dataGapNote>" state (reads the row's
          own dataGapNote column, does not fabricate content);
          status=planned -> renders "coming soon" from the row's own
          metadata. This single component handles all 200 rows -- zero
          per-report scaffolding.
      script_or_component_2:
        path: "src/app/(app)/reports/catalog/page.tsx"
        purpose: >-
          One catalog index page, grouped by `category`, listing all 200
          rows with their live `status` badge -- reuses the existing
          CustomReportsSection.tsx list-rendering pattern rather than
          inventing a new list UI.
      script_3:
        path: ai-os/scripts/report-catalog-ui/verify-catalog-coverage.mjs
        purpose: >-
          Post-build regression check: queries report_definitions live,
          confirms every row's id resolves to a 200-response (not a 500) at
          /reports/catalog/[id], and confirms status=built rows actually
          render non-empty data (not silently falling into the data_gap
          branch due to a wiring bug). Run in CI going forward, not a
          one-off manual click-through of 200 rows.
        exact_command: "node ai-os/scripts/report-catalog-ui/verify-catalog-coverage.mjs --base-url http://localhost:3000"
    step_by_step_plan:
      - "1. Build the two files listed above (script_or_component_1, script_or_component_2) as the ONLY new UI surface needed -- do not build per-report pages."
      - "2. For the 85 data_gap rows, confirm (do not assume) each row's dataGapNote is populated with a real, specific reason (spot-check a sample via `select id, name, data_gap_note from compliance.report_definitions where status='data_gap' limit 20` -- if any are null/empty, that's a data-quality fix needed before shipping the honest-empty-state UI, since an empty dataGapNote would render a broken-looking blank message)."
      - "3. Run verify-catalog-coverage.mjs against a local/staging build before considering this done."
      - "4. Separately (small, optional): link the existing but currently-disconnected reports/page.tsx (Compliance export) and reports/create/page.tsx (AI builder) from the new catalog index page, so a user reaches all reporting surfaces from one entry point -- this is a navigation fix, not new report-building work."
    effort_reestimate: "medium, not large -- one generic component + one index page + a data-quality check on 85 rows' dataGapNote field, no new library integrations required."

  # ------------------------------------------------------------------------
  - id: PLAN-04
    title: "VERI conversation list / software-vs-AI escalation -- DEEP-DIVE REPLACEMENT"
    verified_current_state: >-
      A formal, code-enforced, PRODUCTION-LIVE 3-bucket classification
      already exists: FULL_SOFTWARE / PACKAGE_AVAILABLE / NOVEL, built as
      part of "Priority 5: Software Orchestrator", implemented in
      software-coverage-service.ts + task-execution-engine.ts's executeTask()
      (line ~2073). Mechanism (VERIFIED by reading executeTask in full):
        - engineKey set -> executeEngineDispatch() -> classified FULL_SOFTWARE
          (line ~2102-2110). Confirmed dispatchEngine() (line 383, ~250-line
          switch) is pure computation -- grepped its entire body for
          callLLM/callLLMJson/callLLMVision, zero hits.
        - resolvedWorkerAgentId set -> executeStructuredDispatch() ->
          classified FULL_SOFTWARE (line ~2112-2116).
        - otherwise -> classifyExecutionWithReliability()
          (software-coverage-service.ts:72-78, pure unit-tested function)
          returns PACKAGE_AVAILABLE (a reliable, successRate>=70 approved
          instruction_packages row exists) -> executePackageDispatch()
          (line ~1911): a real LLM call, but constrained to the package's
          fixed steps + explicitly-extracted requiredVariables via
          package-variable-resolver.ts, never raw user text, never open
          reasoning -- "Lower AI."
        - or NOVEL (no match) -> genuine free-text planning call (line
          ~2210+): builds a prompt from the real worker-agent roster +
          assistant memories, calls callLLMJson for {summary, steps[]}, and
          proactively escalates to a STRONGER model specifically because
          it's NOVEL (line ~2292-2318).
      capability-tree-service.ts:43-99 additionally defines
      CapabilityNode.deterministic: boolean, computed by markDeterministic()
      as true iff the leaf carries codeReference || engineKey || reportUrl.
      VeriComposer.tsx:612-616 surfaces this to the user directly: "This
      will be handled by your AI Assistant, not run as a fixed calculation"
      shown exactly when !leaf.deterministic.
      CONFIRMED BUG/GAP (not just a design gap -- an actual incorrect UI
      claim): "deterministic" conflates ROUTING-determinism with
      TOKEN-COST. Proof: capability-tree-service.ts:1153 wires
      codeReference "generate_construction_progress_summary" and
      "detect_construction_budget_schedule_risk" as deterministic: true --
      but their handlers (task-execution-engine.ts:338-350) call
      construction-ai-service.ts's generateProgressSummary()/
      detectBudgetScheduleRisk(), which genuinely invoke an LLM
      (construction-ai-service.ts imports callLLM/callLLMJson/callLLMVision,
      confirmed). So the composer's "not run as a fixed calculation" banner
      is FALSE for these 2 leaves today, in production.
      Separate mechanisms also confirmed real and relevant:
        - high-impact-action-detector.ts: pure keyword matcher (12
          categories: delete/archive/payment/approval/rejection/
          compliance_submission/access_changes/data_export/
          configuration_changes/bulk_operations/communication_send/
          financial_posting), forces a confirmation dialog
          (VeriComposer.tsx:711-746) before ANY write intent in these
          categories executes, regardless of software/AI bucket. Orthogonal
          axis, not part of the escalation taxonomy itself.
        - response-engine.ts (Wave 154): closed ResponseLabel vocabulary
          (yes/no/ok/pending/completed/failed/need_clarity/require_input/
          wrong_data/incomplete_instructions), deterministic short-status
          replies, zero LLM call, used by check_status/generate_report
          handlers in llm-routing-gate.ts.
        - FDE fallback (VeriComposer.tsx:151-157, 349-368): when no
          capability-tree leaf matches, submitFdeFallback() POSTs to
          /api/fde/requests -- routes to HUMAN governance review, not to
          ad hoc AI generation.
      veridian-ui-kit's src/prompt-patterns/catalog.ts (only exists at
      v0.3.0+, NOT at the v0.2.2 compliance-tracker currently consumes) is
      CONFIRMED NOT adjacent to this taxonomy -- it's a different concern
      (which template/model/policy-gate/logging shape to use for a given
      LLM call), only 2 entries (ticket_intelligence.detect,
      email_intelligence.detect), explicitly does not cover
      routing/classification per its own header comment.
    escalation_rule_taxonomy_extending_not_replacing_priority5:
      - rule: "1. Deterministic leaf, deterministic execution (true FULL_SOFTWARE)"
        definition: "chain leaf carries engineKey, or reportUrl, or a codeReference whose handler is a confirmed pure DB read/write with zero LLM calls in its body."
        worked_example: >-
          User completes Calculators -> Mathematical Computation Engine ->
          Basic Arithmetic Engine, operation=add,a=4,b=8 ->
          engineKey:"basic_arithmetic_engine" -> dispatchEngine() case runs
          directly, zero tokens.
      - rule: "2. Deterministic leaf, AI-BACKED execution (currently MISLABELED as FULL_SOFTWARE -- this is the confirmed bug to fix)"
        definition: "click-routed (deterministic:true in the UI), but the handler itself calls an LLM."
        worked_example: >-
          User picks Construction -> [Project] -> "AI Progress Summary" ->
          codeReference:"generate_construction_progress_summary" ->
          dispatchTool() -> generateProgressSummary()
          (construction-ai-service.ts) genuinely calls an LLM. Needs a
          SECOND boolean (e.g. CapabilityNode.aiBacked) distinct from
          `deterministic`, so the UI banner can say something true: "handled
          automatically, but uses AI to generate this specific summary" vs.
          today's flatly false "not run as a fixed calculation."
        fix_mechanism: >-
          ai-os/scripts/veri-escalation/audit-ai-backed-leaves.mjs: uses the
          TypeScript Compiler API to statically trace every
          codeReference/engineKey handler in task-execution-engine.ts for
          any call (direct or one level of indirection through an imported
          service function) to callLLM/callLLMJson/callLLMVision, and
          auto-generates the aiBacked:true/false value per leaf instead of a
          human manually auditing 20+ handlers by eye.
          Exact command: "node ai-os/scripts/veri-escalation/audit-ai-backed-leaves.mjs --write-flags capability-tree-service.ts"
          Re-run requirement: must be re-run after PLAN-02's codegen adds
          new codeReference branches (see dependency_table entry
          PLAN-02->PLAN-04 above) so newly-wired actions get classified too.
      - rule: "3. Learned, approved narrow package (PACKAGE_AVAILABLE)"
        definition: "free text matches a capability with a reliable (successRate>=70) approved instruction package; LLM runs but constrained to explicitly-extracted variables only, never raw reasoning."
        worked_example: >-
          Chain "CRM -> Leads -> Create Lead" has an approved package; user
          types "create a lead for Acme Corp, contact John, phone
          555-1234" -> executePackageDispatch() extracts
          {company,contact,phone} via package-variable-resolver.ts, runs the
          package's fixed steps on the floor-tier model.
      - rule: "4. Ambiguous free text, full AI planning (NOVEL)"
        definition: "no capability match, or no reliable approved package; genuine escalation, proactively bumped to a stronger model."
        worked_example: >-
          First-time free text like "figure out why the Q3 GST
          reconciliation looks off for the Mumbai branch," no prior learned
          capability -> full callLLMJson planning call against the real
          worker-agent roster.
      - rule: "5. Deterministic short-reply, no dispatch at all"
        definition: "answerable from state software already knows, via response-engine.ts's closed ResponseLabel vocabulary."
        worked_example: >-
          "What's the status of the GST filing task?" ->
          suggestResponseForTaskStatus(task.status) -> "Pending -- GST
          Return Q2 filing", zero tokens, no task created.
      - rule: "6. No capability-tree entry -- escalate to human governance, not ad hoc AI generation"
        definition: "user's need has no matching leaf and no fallback package."
        worked_example: >-
          User finds no leaf for "merge duplicate leads" in the Chain
          Selector -> clicks the fallback -> submitFdeFallback() POSTs to
          /api/fde/requests, routed for human review via the existing FDE
          governance pipeline, never dispatched or free-text-answered.
      - rule: "7. Cross-cutting write-safety gate (applies ON TOP of rules 1-6, not its own bucket)"
        definition: "deterministic phrase match (high-impact-action-detector.ts) pauses ANY of the above for explicit confirmation."
        worked_example: >-
          "Delete the Q1 compliance item for Acme Corp" -> detectHighImpactAction
          matches "delete" -> needsConfirmation:true -> AlertDialog
          (VeriComposer.tsx:711) gates whichever of rules 1-6 would
          otherwise run.
    automation_mechanism_summary: >-
      The taxonomy above is implemented as CODE (a second boolean field +
      one static-analysis script), not a human-consulted decision document.
      Developers/AI adding new capability-tree leaves in the future get the
      aiBacked classification computed automatically by
      audit-ai-backed-leaves.mjs on every CI run (recommend wiring it into
      the existing test/typecheck CI step), not by manually filling in a
      taxonomy lookup table per new leaf.
    step_by_step_plan:
      - "1. Add `aiBacked: boolean` to the CapabilityNode type (capability-tree-service.ts, near line 43-99's existing `deterministic` field)."
      - "2. Write and run audit-ai-backed-leaves.mjs once against the CURRENT capability tree (pre-PLAN-02) to backfill aiBacked for all existing leaves."
      - "3. Update VeriComposer.tsx:612-616's banner logic to branch on both booleans (4 real states: software+no-AI / software+AI-backed / package-AI / novel-AI), replacing the single false-in-2-cases message."
      - "4. Wire audit-ai-backed-leaves.mjs into CI (or at minimum, into PLAN-02's step_D_verify sequence) so it re-runs whenever new leaves are added."
      - "5. Publish rules 1-7 above as the literal artifact this planning item asked for -- e.g. as a short markdown doc referencing the code (VERI_ESCALATION_TAXONOMY.md), not a new runtime system, since the classification itself already lives in code."
    effort_reestimate: "medium -- most of the hard architectural work already exists; this is one new field, one static-analysis script, and one UI banner fix, not a new subsystem."

