    strategic_priority_ranking_cheapest_to_most_expensive:
      - "1. Compliance + GST -- already done, use as literal template."
      - "2. CRM (createLead/createOpportunity already real, DB-backed) -- cheapest net-new wire."
      - "3. Finance/Accounting (createJournalEntry + full erp-accounting-service.ts already real) -- second cheapest."
      - "4. PROJEXA construction CRUD (8-11 modules, REST layer already exists, needs new proxy-aware wiring since PROJEXA has no local capability-tree-service.ts) -- medium cost, but same shape repeated many times, hence the codegen approach below matters most here."
      - "5. HR/Payroll and Sales-HQ -- unverified whether service layer exists; must be confirmed BEFORE estimating, could be cheap (if service layer exists) or expensive (if it needs net-new writes)."
    automation_mechanism:
      design_rationale: >-
        Owner directive: no table-by-table manual wiring. The Compliance
        reference case shows every module's wiring needs the exact same
        3-part shape: (a) a CapabilityInputField[] const array (validated
        form fields), (b) a workerAgents DB row with a codeReference, feeding
        a buildXNodes() function registered in MODULE_SCOPE_TOP_LEVEL_KEYS,
        (c) a codeReference branch in dispatchTool()'s if-chain that
        validates context.inputs and performs the real write (in
        Compliance's case, inlined rather than calling the service function
        directly, because dispatch context's shape differs from
        service-layer ServiceContext -- the generator below produces an
        adapter shim automatically rather than assuming direct passthrough).
        This 3-part shape is mechanical enough to generate from a manifest.
        No new dependency is needed for the codegen itself -- the
        `typescript` package (already a devDependency, ^6.0.3, confirmed via
        package.json) provides the Compiler API used for safe AST-based
        insertion instead of fragile string templating.
      pipeline:
        step_A_scaffold_manifest:
          script: ai-os/scripts/wire-module-dispatch/scaffold-manifest.mjs
          purpose: >-
            Introspects a given *-service.ts file's exported functions (via
            ts.createSourceFile + ts.forEachChild, reading function name,
            parameter names, and parameter types) and auto-proposes manifest
            entries (action_id, required_fields with best-guess type/label,
            target db table inferred from the function body's
            db.insert(<table>) call). This is NOT the human writing the
            manifest from scratch -- it's the human reviewing/approving a
            machine-generated first draft, roughly 5 minutes per module, not
            hours of manual design.
          exact_commands:
            - "node ai-os/scripts/wire-module-dispatch/scaffold-manifest.mjs --service src/lib/services/crm-service.ts --module crm --scope-key crm >> ai-os/scripts/wire-module-dispatch/module-actions-manifest.yaml"
            - "node ai-os/scripts/wire-module-dispatch/scaffold-manifest.mjs --service src/lib/services/erp-accounting-service.ts --module finance --scope-key erp >> ai-os/scripts/wire-module-dispatch/module-actions-manifest.yaml"
            - "node ai-os/scripts/wire-module-dispatch/scaffold-manifest.mjs --service <hr-service-file, CONFIRM PATH FIRST -- see verification note below> --module hr --scope-key hr >> ai-os/scripts/wire-module-dispatch/module-actions-manifest.yaml"
            - "node ai-os/scripts/wire-module-dispatch/scaffold-manifest.mjs --service <sales-service-file, CONFIRM PATH FIRST> --module sales --scope-key sales >> ai-os/scripts/wire-module-dispatch/module-actions-manifest.yaml"
          precondition_verification_step: >-
            Before running the HR/sales lines, run:
            `find src/lib/services -iname '*hr*service*' -o -iname '*payroll*service*' -o -iname '*sales*service*'`
            to confirm the actual file path/existence first (this was
            explicitly NOT verified in this deep-dive -- do not assume the
            path, discover it mechanically).
          for_projexa_construction_modules: >-
            Since PROJEXA has no local service-layer file in the same shape
            (its writes go through its own Next.js API routes directly to
            Supabase, not through a compliance-tracker-style *-service.ts),
            run scaffold-manifest.mjs in a second mode against PROJEXA's API
            route handlers instead:
            `node ai-os/scripts/wire-module-dispatch/scaffold-manifest.mjs --api-routes /opt/veridian/repos/projexa/src/app/api/{labour-roster,materials,permits,punch-list,floor-plans,ffe,procurement,purchase-orders,change-orders,quotations,mood-boards} --module construction --scope-key construction --target-repo compliance-tracker`
            (the manifest entries land in compliance-tracker's
            task-execution-engine.ts, since that's where codeReference
            dispatch lives; PROJEXA's existing thin-proxy pattern
            (src/app/api/assistant/route.ts) then reaches them automatically
            once registered, requiring zero new PROJEXA-side code).
        step_B_generate_bindings:
          script: ai-os/scripts/wire-module-dispatch/generate-dispatch-bindings.mjs
          purpose: >-
            Reads the FULL manifest (all modules, one pass) and mechanically
            injects, via the TypeScript Compiler API (not string
            concatenation): (1) one CapabilityInputField[] const + one
            buildXNodes() function + one MODULE_SCOPE_TOP_LEVEL_KEYS entry
            per module into capability-tree-service.ts, anchored
            immediately after the existing buildComplianceItemNodes()
            function (capability-tree-service.ts line ~1323) using it as the
            literal structural template; (2) one codeReference if-branch per
            manifest action into task-execution-engine.ts, anchored
            immediately after the existing create_compliance_item branch
            (line ~185), following its exact validate-then-insert shape.
            Every module in the manifest is done in ONE script execution,
            not module-by-module by hand.
          exact_command: "node ai-os/scripts/wire-module-dispatch/generate-dispatch-bindings.mjs --manifest ai-os/scripts/wire-module-dispatch/module-actions-manifest.yaml --dry-run"
          then: "node ai-os/scripts/wire-module-dispatch/generate-dispatch-bindings.mjs --manifest ai-os/scripts/wire-module-dispatch/module-actions-manifest.yaml --apply"
        step_C_seed_worker_agents:
          script: ai-os/scripts/wire-module-dispatch/seed-worker-agents.mjs
          purpose: >-
            buildXNodes() (per the Compliance template) queries
            db.query.workerAgents.findFirst({ where: eq(codeReference, ...) })
            -- the row must exist or the leaf silently never appears. This
            script reads the same manifest and emits+applies one INSERT INTO
            worker_agents per action, in one batch, instead of manual SQL
            per module.
          exact_command: "node ai-os/scripts/wire-module-dispatch/seed-worker-agents.mjs --manifest ai-os/scripts/wire-module-dispatch/module-actions-manifest.yaml --apply"
        step_D_verify:
          exact_commands:
            - "bunx tsc --noEmit"
            - "bun test src/lib/task-execution-engine.test.ts src/lib/services/capability-tree-service.test.ts"
            - "node ai-os/scripts/wire-module-dispatch/smoke-test-new-actions.mjs --manifest ai-os/scripts/wire-module-dispatch/module-actions-manifest.yaml --target-org <disposable-test-org-id>"
          smoke_test_script_purpose: >-
            Automatically POSTs to /api/tasks with a synthetic codeReference
            dispatch for EVERY new manifest action against one disposable
            test org (not demo_org, not production), asserts a real DB row
            landed in the target table, then deletes it -- this replaces
            "manually click every module in the browser 20 times" with one
            script run covering all of them.
    step_by_step_plan:
      - "1. Confirm HR/Payroll and Sales-HQ service-layer file paths (precondition_verification_step above) -- do not skip, this was the one gap left open in this audit."
      - "2. Run scaffold-manifest.mjs once per module (CRM, Finance, HR, Sales, then the PROJEXA API-routes mode for construction) -- produces one combined manifest file."
      - "3. Human review pass on the generated manifest (~5 min/module, approve/edit field labels and types) -- this is the ONE deliberately-manual step, and it is reviewing machine output, not authoring from scratch."
      - "4. Run generate-dispatch-bindings.mjs --dry-run, inspect the diff, then --apply."
      - "5. Run seed-worker-agents.mjs --apply."
      - "6. Run all of step_D_verify's three commands. Do not consider PLAN-02 done until the smoke-test script shows 100% pass across every manifest action."
      - "7. Log each module's completion as its own ai-os/boss/COMPLETED.yaml wave entry (per this repo's convention), not one giant entry -- PLAN-06's audit needs per-module granularity."
    effort_reestimate: >-
      Still large in absolute engineering surface (CRM + Finance + HR +
      Sales + 8-11 PROJEXA modules), but the manifest+codegen approach
      converts what would have been ~15-20 separate hand-written PRs into
      1-2 codegen-script runs + 1 human review pass + 1 automated smoke
      test. Recommend still tracking as its own dedicated execution track
      (the 2026-07-21 plan's instinct on this was correct) but the actual
      execution mechanism is now concrete rather than open-ended.

