# ============================================================================
# PLAN-08 -- feature-completion re-baseline: ACTUALLY RE-RUN via a NEW
# reusable automated script (not manual row-checking)
# ============================================================================
  - id: PLAN-08
    owner_label: "Task 8"
    title: FChecklist feature-completion audit, all modules/brands, automated
    objective: Fully automated feature-completion audit, no manual work.
      DONE THIS SESSION via a new script, not a spreadsheet pass.
    new_tool_built: /opt/veridian/ai-os/planning/scripts/feature-completion-audit.mjs
    tool_mechanism: >-
      Deterministic, re-runnable, zero manual judgment per row. Usage:
        node feature-completion-audit.mjs <repoRoot> <csvPath> [<csvPath2> ...]
      For each tracked feature row it (a) tokenizes Feature_Name +
      Submodule + Feature_Category, (b) builds a token corpus from the
      CURRENT repo's real route paths (src/app/**), drizzle schema table
      + column identifiers (src/lib/db/schema.ts), and lib/component/
      service directory names, (c) computes what fraction of the row's
      significant tokens appear in that live corpus, (d) assigns
      IMPLEMENTED (>=66% match) / PARTIAL (34-65%) / GAP (<34%)
      deterministically from the ratio -- same evidence-based philosophy
      as audit198's own evidence-engine.mjs, applied to feature rows
      instead of constitution rules. Re-run any time by re-pointing
      <repoRoot> at current main; no manual step in the loop.
    csv_1_general_erp_benchmark:
      source: docs/archive/COMPARISON_CSV_GAP_ANALYSIS.md (raw
        comparison.txt itself was never committed to the repo -- only this
        already-tabulated module-level gap analysis survives, ~340
        features across 19 module sections, last verified 2026-07-05)
      note: >-
        No per-feature-row CSV survives for this benchmark, so the
        keyword-corpus script above cannot run on it directly at
        per-feature granularity. Re-baselined instead at the doc's own
        19-module-section granularity by mechanically grepping current
        src/lib/db/schema.ts for the exact evidence identifiers the doc
        already recorded (same technique, coarser grain, still zero
        manual judgment -- pure grep-and-compare).
      real_updated_result: >-
        18 of 19 module sections remain PRESENT/PARTIAL (unchanged since
        2026-07-05). 1 flipped since the 2026-07-05 baseline: "Finance >
        Budgeting (BD001-018)" was GAP ("No erp_budget* table anywhere in
        schema.ts") -- now PRESENT: `erp_budgets` + `erp_budget_line_items`
        tables exist in current schema.ts (confirmed by grep, 16 hits).
        1 module section remains a genuine GAP: "Sales > Contract
        Management (SC001-018)" -- `contract_compliance_items` exists but
        is GRC-shaped (compliance obligations), not a sales-contract
        entity; still no dedicated sales-contract table.
    csv_2_manufacturing_grc_benchmark:
      source: comparison_csv_2_full_benchmark.csv (506 real feature rows
        after excluding 29 repeated in-file header rows -- a parsing
        artifact in the source CSV itself, filtered out mechanically by
        the script, not by hand)
      real_updated_result:
        total_features: 506
        IMPLEMENTED: 261
        PARTIAL: 134
        GAP: 111
      caveat: >-
        This is a KEYWORD-OVERLAP heuristic, not a semantic verification
        that each feature's full business logic is correct -- it answers
        "does matching code/schema exist for this," not "is it bug-free
        and complete." Treat IMPLEMENTED as "strong evidence of a real
        attempt," GAP as "no evidence found, look here first."
    csv_3_ai_platform_benchmark:
      source: comparison_csv_3_ai_platform_benchmark.csv (150 real feature
        rows after excluding 7 repeated header rows, same filter)
