    critical_finding_auth_mechanism: >-
      compliance.users.password_hash is DEAD CODE for authentication.
      Verified by reading src/lib/supabase/auth-guard.ts:165 -- every
      normal signup sets this NOT-NULL legacy column to the literal
      string "supabase-auth-managed" and it is never read again. Real
      authentication is 100% delegated to Supabase Auth
      (auth.users in Supabase project pcrjmlpuqsbocqfwoxod, name
      "verdian-ai" -- confirmed live via Supabase MCP: this project holds
      compliance.users at 718 rows, matching the live app). Writing any
      kind of hash into compliance.users.password_hash -- bcrypt or
      otherwise -- would do NOTHING. The wave9 migration's
      'MIGRATED_NO_LOGIN_...' placeholder is exactly as inert as the
      normal "supabase-auth-managed" placeholder; both are decorative.
      The ONLY correct mechanism is the Supabase Auth Admin API
      (service-role key), exactly as prior art
      scripts/wave111-create-hero-logins.ts already does for the
      2026-07-06 demo company's hero personas.
      Second finding: compliance.users rows are matched to Supabase Auth
      by EMAIL, not by a pre-wired id (src/lib/supabase/auth-guard.ts:270,
      `db.query.users.findFirst({ where: eq(users.email, email) })`), and
      if the matched row's auth_user_id doesn't yet equal the live
      Supabase auth id, the app self-heals the link automatically on the
      very next authenticated request (auth-guard.ts:275-277). So the
      ONLY step that actually needs to happen is creating/resetting the
      Supabase Auth user with the right email + password -- no manual
      compliance.users UPDATE is strictly required, though the queued
      script below also emits one as a belt-and-suspenders immediate
      confirmation.
